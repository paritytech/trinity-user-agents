name: maven-central-mirror
description: Resolve every Maven Central repository through Google's mirror of it.

runs:
  using: composite
  steps:
    # Gradle applies every script in the user home's init.d to each build, so
    # this reaches the build a job runs, any build it includes, and every
    # caller's tasks. Installed after whatever Gradle setup the job does, so a
    # restored Gradle home cannot land on top of it.
    - name: Resolve Maven Central through its mirror
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/maven-central-mirror.gradle
      run: install -D -m 0644 "${SCRIPT}" "${GRADLE_USER_HOME:-${HOME}/.gradle}/init.d/maven-central-mirror.gradle"
