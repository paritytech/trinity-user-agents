// Resolves every Maven Central repository through Google's mirror of it.
//
// Maven Central rate limits by IP, and hosted runners share their addresses,
// so a build here can be refused with a 429 for traffic that is not ours. The
// mirror serves the same artifacts from Google Cloud Storage without that
// limit. Installed into the Gradle user home by the action beside this file, so
// local builds and the vendored settings files are untouched.

def central = 'https://repo.maven.apache.org/maven2'
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

def redirect = { RepositoryHandler repositories ->
    repositories.withType(MavenArtifactRepository).configureEach { repository ->
        if (repository.url.toString().startsWith(central)) {
            repository.url = mirror
        }
    }
}

beforeSettings { settings ->
    redirect(settings.buildscript.repositories)
    redirect(settings.pluginManagement.repositories)
    redirect(settings.dependencyResolutionManagement.repositories)
}

allprojects {
    redirect(buildscript.repositories)
    redirect(repositories)
}
