name: Install the pinned SwiftLint
description: >-
  Puts one SwiftLint release first on PATH for the rest of the job, so the
  app's "Run Swiftlint" build phase lints with the same version on every
  runner fleet and the warning baseline holds on all of them. On Linux it
  installs the same release's Linux binary, which loads SourceKit from the
  runner's Swift toolchain.

# The build phase runs whatever swiftlint it finds and only installs from
# Homebrew when there is none. GitHub's images have none, so they install the
# latest release each run; the self-hosted runners have one installed already,
# at whatever version they were given. The two drift apart, and a rule known
# to one version is an invalid identifier to the other, which the warning
# ratchet reports as a new warning.
#
# The binary lives under RUNNER_TEMP rather than in Homebrew, because the
# self-hosted runners are persistent and shared: it lasts for this job and
# touches nothing the next one sees.
#
# To move the pin, change all three values below together, then adopt the
# warnings artifact the build job uploads as the new baseline.

inputs:
  version:
    description: SwiftLint release to install.
    required: false
    default: "0.65.1"
  sha256:
    description: SHA-256 of that release's portable_swiftlint.zip.
    required: false
    default: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
  linux_sha256:
    description: SHA-256 of that release's swiftlint_linux_amd64.zip.
    required: false
    default: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d

runs:
  using: composite
  steps:
    - name: Install SwiftLint ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ runner.os == 'Linux' && inputs.linux_sha256 || inputs.sha256 }}
        ASSET: ${{ runner.os == 'Linux' && 'swiftlint_linux_amd64.zip' || 'portable_swiftlint.zip' }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/swiftlint-${VERSION}"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "${dir}/${ASSET}" \
          "https://github.com/realm/SwiftLint/releases/download/${VERSION}/${ASSET}"
        echo "${SHA256}  ${dir}/${ASSET}" | shasum -a 256 -c -
        unzip -q -o "${dir}/${ASSET}" -d "$dir"
        rm "${dir}/${ASSET}"
        # The Linux archive carries a static build too, which cannot load
        # SourceKit and so skips every rule that needs it. The dynamic build
        # loads it from the runner's Swift toolchain.
        if [ "$RUNNER_OS" = Linux ]; then
          rm -f "${dir}/swiftlint-static"
          swift_bin="$(command -v swift || true)"
          if [ -z "$swift_bin" ]; then
            echo "::error::No Swift toolchain on PATH to load SourceKit from"
            exit 1
          fi
          lib="$(dirname "$(dirname "$(readlink -f "$swift_bin")")")/lib"
          if [ ! -f "${lib}/libsourcekitdInProc.so" ]; then
            echo "::error::No libsourcekitdInProc.so in ${lib}"
            exit 1
          fi
          echo "LINUX_SOURCEKIT_LIB_PATH=${lib}" >> "$GITHUB_ENV"
        fi
        actual="$("${dir}/swiftlint" version)"
        if [ "$actual" != "$VERSION" ]; then
          echo "::error::Expected SwiftLint ${VERSION}, the binary reports ${actual}"
          exit 1
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "SwiftLint ${actual} at ${dir}"
