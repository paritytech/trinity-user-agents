name: Install the pinned SwiftLint
description: >-
  Puts one SwiftLint release first on PATH for the rest of the job, so the
  app's "Run Swiftlint" build phase lints with the same version on every
  runner fleet and the warning baseline holds on all of them.

# The build phase runs whatever swiftlint it finds and only installs from
# Homebrew when there is none. GitHub's images have none, so they install the
# latest release each run; the self-hosted runners have one installed already,
# at whatever version they were given. The two drift apart, and a rule known
# to one version is an invalid identifier to the other, which the warning
# ratchet reports as a new warning.
#
# The binary lives under RUNNER_TEMP rather than in Homebrew, because the
# self-hosted runners are persistent and shared: it lasts for this job and
# touches nothing the next one sees.
#
# To move the pin, change both values below together, then adopt the warnings
# artifact the build job uploads as the new baseline.

inputs:
  version:
    description: SwiftLint release to install.
    required: false
    default: "0.65.1"
  sha256:
    description: SHA-256 of that release's portable_swiftlint.zip.
    required: false
    default: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

runs:
  using: composite
  steps:
    - name: Install SwiftLint ${{ inputs.version }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/swiftlint-${VERSION}"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "${dir}/portable_swiftlint.zip" \
          "https://github.com/realm/SwiftLint/releases/download/${VERSION}/portable_swiftlint.zip"
        echo "${SHA256}  ${dir}/portable_swiftlint.zip" | shasum -a 256 -c -
        unzip -q -o "${dir}/portable_swiftlint.zip" -d "$dir"
        rm "${dir}/portable_swiftlint.zip"
        actual="$("${dir}/swiftlint" version)"
        if [ "$actual" != "$VERSION" ]; then
          echo "::error::Expected SwiftLint ${VERSION}, the binary reports ${actual}"
          exit 1
        fi
        echo "$dir" >> "$GITHUB_PATH"
        echo "SwiftLint ${actual} at ${dir}"
