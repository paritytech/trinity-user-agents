name: Label gate

# Fails while a pull request carries a `needs:` label or `status:blocked`, so
# those labels are a gate rather than a request. Removing the label re-runs this
# and clears it.
#
# It holds a merge only once "Label gate" is a required check on main. Until
# then it marks the pull request red without stopping it. A pull request opened
# with the workflow token, such as a backport work order, raises no event, so it
# has no result here until someone pushes to it; making this check required
# leaves those waiting until then.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  # A required check has to report in the merge queue too. A queued pull request
  # can still be labelled, so the queue run reads its labels again.
  merge_group:

permissions: {}

jobs:
  gate:
    name: Label gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - name: Check for a label that holds the merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # gh-readonly-queue/<base>/pr-<number>-<sha>, naming the pull request
          # this queue entry adds.
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ -n "$QUEUE_REF" ]; then
            number="$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$QUEUE_REF")"
            if [ -z "$number" ]; then
              echo "::error::Cannot read a pull request number from ${QUEUE_REF}."
              exit 1
            fi
            labels="$(gh api "repos/${REPO}/issues/${number}/labels" --paginate --jq '.[].name')"
          else
            labels="$(jq -r '.[]' <<<"$EVENT_LABELS")"
          fi
          held="$(grep -E '^(needs:|status:blocked$)' <<<"$labels" || true)"
          if [ -n "$held" ]; then
            while IFS= read -r label; do
              echo "::error::\`${label}\` holds this pull request. Remove it once that is resolved."
            done <<<"$held"
            exit 1
          fi
          echo "No label holds this pull request."
