# A nightly Android build, delivered to Firebase App Distribution and
# published as a GitHub prerelease asset.
#
# The iOS nightly goes to TestFlight; App Distribution is this platform's
# equivalent, and it reaches a named tester group rather than anyone with the
# link. That remains the channel for testers.
#
# The asset exists because paritytech/triangle-e2e installs the nightly on an
# emulator and App Distribution gives it nothing to download. Same shape as the
# `simulator-*` prereleases its iOS shard already consumes from this repo.
#
# Authentication is federated. The job proves its identity with the run's OIDC
# token and receives a short lived credential, so no long lived key for this
# project is stored anywhere.
name: Android nightly

on:
  # Two hours after the iOS nightly starts, which takes a little over an hour,
  # so the two never overlap and a night's results arrive in one window.
  schedule:
    # Every day. A night with nothing new since the last successful build is
    # skipped by the first job rather than by the calendar.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  # id-token to mint the OIDC assertion the identity exchange consumes.
  # contents: write to cut the prerelease that carries the APK.
  contents: write
  id-token: write

jobs:
  # A scheduled night with nothing merged since the last successful build would
  # still cut a prerelease, upload to App Distribution and announce an empty
  # changelog. Only the schedule is skipped; a dispatch always builds.
  changed:
    name: Changed since the last nightly
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        uses: ./.github/actions/changed-since-last-build
        with:
          github_token: ${{ github.token }}
          workflow: android-nightly.yml

  # Checks what can be checked before an hour of building. It confirms the
  # delivery target is real; it cannot confirm we may write to it, because
  # every read-only call is available to a role that cannot upload.
  preflight:
    name: Check delivery is possible
    needs: changed
    # !cancelled() so a failed check builds rather than skips, and != 'false'
    # so an empty output does the same.
    if: >-
      !cancelled()
      && (github.event_name != 'schedule' || needs.changed.outputs.changed != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/check-android-delivery
        with:
          app_id: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          groups: ${{ vars.ANDROID_FIREBASE_GROUP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  nightly:
    name: Build and publish
    needs: preflight
    runs-on: ubuntu-latest
    # Two flavours of the same build, the second reusing most of what the first
    # compiled.
    timeout-minutes: 75
    outputs:
      build_id: ${{ steps.setup.outputs.build_id }}
      version_name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.release-tag.outputs.tag }}
      vanilla: ${{ steps.build.outputs.vanilla }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The versionName the APK is built with. App Distribution lists a release
      # as this plus the build id, so an announcement naming both matches what a
      # tester sees there.
      #
      # Read before anything is built or uploaded, because it reads a checked-in
      # constant and depends on nothing the build produces. Failing here costs a
      # minute; failing after the upload leaves testers with a build and the
      # release asset uncut.
      - name: Read the marketing version
        id: version
        run: |
          set -euo pipefail
          name=$(sed -n 's/.*DefaultVersionName = "\([^"]*\)".*/\1/p' \
            hosts/android/build-logic/convention/src/main/kotlin/Versions.kt \
            | head -n1)
          if [ -z "${name}" ]; then
            echo "::error::No DefaultVersionName in Versions.kt"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Set up the Android build
        id: setup
        uses: ./.github/actions/setup-android-build
        with:
          require_inputs: "true"
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          keystore_base64: ${{ secrets.CI_GITHUB_KEYSTORE_KEY_FILE }}
          keystore_pass: ${{ secrets.CI_KEYSTORE_PASS }}
          keystore_alias: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          keystore_key_pass: ${{ secrets.CI_KEYSTORE_KEY_PASS }}

      # versionCode comes from the environment; the tree falls back to a
      # constant when it is absent, which would collide across runs.
      - name: Build the nightly APKs
        id: build
        working-directory: hosts/android
        env:
          CI_BUILD_ID: ${{ steps.setup.outputs.build_id }}
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
          FIAT_SYMBOL: ${{ vars.FIAT_SYMBOL || '$' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Both fall back to an example.com placeholder rather than failing, so
          # omitting them ships those defaults in an artifact people test with.
          GAME_RESULTS_FALLBACK_URL: ${{ vars.GAME_RESULTS_FALLBACK_URL }}
          REFERRAL_WEB_HOST: ${{ vars.REFERRAL_WEB_HOST }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        # gp first, because it is what testers receive, so a failure in vanilla,
        # the flavour without Google Play services, can never hold it back.
        # Vanilla reuses most of what gp compiled; when it fails the night
        # ships gp alone and the announcement says so.
        run: |
          set -euo pipefail
          ./gradlew assembleGpNightly --no-daemon
          if ./gradlew assembleVanillaNightly --no-daemon; then
            echo "vanilla=built" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The vanilla APK did not build, so tonight ships gp alone"
            echo "vanilla=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the APK is signed by the expected key
        id: package
        working-directory: hosts/android
        env:
          BUILD_ID: ${{ steps.setup.outputs.build_id }}
          VANILLA: ${{ steps.build.outputs.vanilla }}
          EXPECTED_SIGNER: a25eb8df5e015651d6d52849f79b8450b9b36353921600c22e454d4f00372fc6
        run: |
          set -euo pipefail

          # nullglob stays off here: a non-matching glob would otherwise vanish,
          # ls would print the working directory, and the guard would not fire.
          # || true so pipefail does not abort before the message explains it.
          apksigner="$(ls -d "${ANDROID_HOME:-}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "${apksigner}" ]; then
            echo "::error::No apksigner under ${ANDROID_HOME:-<unset>}/build-tools"
            exit 1
          fi

          short="${GITHUB_SHA:0:9}"
          flavours=gp
          [ "${VANILLA}" = built ] && flavours="gp vanilla"
          for flavour in ${flavours}; do
            shopt -s nullglob
            found=("app/build/outputs/apk/${flavour}/nightly"/*.apk)
            shopt -u nullglob
            if [ ${#found[@]} -ne 1 ]; then
              echo "::error::Expected one ${flavour} APK, found ${#found[@]}"
              exit 1
            fi

            # verify alone passes for an APK signed by any key, so a rotated or
            # wrong keystore would ship a build that every tester's device
            # rejects on install. Compare the certificate instead.
            signer="$("${apksigner}" verify --print-certs "${found[0]}" \
              | sed -n 's/.*SHA-256 digest: //p' | head -n1)"
            if [ "${signer}" != "${EXPECTED_SIGNER}" ]; then
              echo "::error::${flavour} APK is signed by ${signer}, expected ${EXPECTED_SIGNER}"
              exit 1
            fi

            mv "${found[0]}" "polkadot-app-${flavour}-${BUILD_ID}-${short}.apk"
          done

          # Signing is done, so neither the key nor the configuration is
          # reachable by anything that runs later in this job.
          rm -f develop_key.jks app/google-services.json

          echo "short=${short}" >> "$GITHUB_OUTPUT"

      # Exchanges the run's OIDC assertion for a short lived credential and
      # writes it where Application Default Credentials will find it. Neither
      # input is sensitive; they are secrets because the project layout is not
      # something a public repository should advertise.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The CLI rather than a wrapper action, because the credential written
      # above is an external account rather than a service account key, and the
      # CLI resolves it through the standard credential chain instead of
      # parsing the file itself.
      - name: Distribute to testers
        working-directory: hosts/android
        env:
          APP_ID: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          GROUP: ${{ vars.ANDROID_FIREBASE_GROUP }}
          SHORT: ${{ steps.package.outputs.short }}
          BUILD_ID: ${{ steps.setup.outputs.build_id }}
        run: |
          set -euo pipefail

          # A group of only separators is parsed to an empty list, and an upload
          # with no recipients succeeds and reaches nobody, which is worse than
          # failing. Check what survives parsing, not just the empty string.
          if [ -z "${GROUP//[[:space:],]/}" ]; then
            echo "::error::ANDROID_FIREBASE_GROUP names no group, so this build would reach no testers"
            exit 1
          fi

          # Installed under its own prefix. This directory has no package.json,
          # so npm would otherwise walk up and install into the repository root,
          # leaving nothing to run here.
          # --ignore-scripts because this job holds a cloud credential and can
          # mint its own identity assertions, so nothing fetched should run at
          # install time. The CLI is fully functional without them.
          cli="${RUNNER_TEMP}/firebase-cli"
          npm install --prefix "${cli}" --no-save --no-audit --no-fund \
            --ignore-scripts firebase-tools@14.11.1

          # Only the flavour that ships. App Distribution keys a release on the
          # version name and code, which the two flavours share, so uploading
          # both to one app would have the second replace the first and report
          # success. Vanilla needs its own app before it can be distributed.
          # On success the CLI prints a signed URL that downloads the APK with
          # no credential of its own. This repository is public and its build
          # log is too, and the binary carries configuration that must not be,
          # so the output is held back until every token in it is registered as
          # a secret. Registering one only affects what is written afterwards,
          # which is why none of this is streamed. The line itself is dropped:
          # a one hour download link serves no purpose in a log that outlives
          # it by years.
          out="${RUNNER_TEMP}/distribute.log"
          status=0
          "${cli}/node_modules/.bin/firebase" appdistribution:distribute \
            "polkadot-app-gp-${BUILD_ID}-${SHORT}.apk" \
            --app "${APP_ID}" \
            --groups "${GROUP}" \
            --release-notes "Build ${BUILD_ID}, from ${GITHUB_SHA}." > "${out}" 2>&1 || status=$?

          tokens="$(grep -oE 'token=[^&"[:space:]]+' "${out}" \
            | cut -d= -f2- | sort -u || true)"
          if [ -n "${tokens}" ]; then
            while IFS= read -r token; do
              [ -n "${token}" ] && echo "::add-mask::${token}"
            done <<< "${tokens}"
          fi

          grep -v 'Download the release binary' "${out}" || true
          exit "${status}"

      # Tag shape mirrors ios-nightly-simulator-release.yml.
      - name: Compute release tag + name
        id: release-tag
        run: |
          set -euo pipefail
          DATE_TAG=$(date -u +%Y%m%d-%H%M)
          DATE_NAME=$(date -u +'%d.%m.%Y %H:%M')
          SHORT_SHA=${GITHUB_SHA:0:7}
          {
            echo "tag=android-${DATE_TAG}-${SHORT_SHA}"
            echo "name=Nightly Android ${DATE_NAME} UTC"
          } >> "$GITHUB_OUTPUT"

      # The names polkadot-android-community used, so consumers need no change.
      - name: Name the assets for consumers
        id: release-asset
        working-directory: hosts/android
        env:
          SHORT: ${{ steps.package.outputs.short }}
          BUILD_ID: ${{ steps.setup.outputs.build_id }}
          VANILLA: ${{ steps.build.outputs.vanilla }}
        run: |
          set -euo pipefail
          assets=app-gp-nightly.apk
          cp "polkadot-app-gp-${BUILD_ID}-${SHORT}.apk" app-gp-nightly.apk
          if [ "${VANILLA}" = built ]; then
            cp "polkadot-app-vanilla-${BUILD_ID}-${SHORT}.apk" app-vanilla-nightly.apk
            assets="${assets} app-vanilla-nightly.apk"
          fi
          # shellcheck disable=SC2086  # assets is a space-separated list of names
          ls -la ${assets}
          echo "assets=${assets}" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            for asset in ${assets}; do echo "hosts/android/${asset}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.name }}
          generate_release_notes: true
          body: |
            Nightly build `${{ steps.setup.outputs.build_id }}`, in two flavours:

            - `app-gp-nightly.apk`, the Google Play (`gp`) flavour, the same APK the Firebase release carries.
            - `app-vanilla-nightly.apk`, the flavour without Google Play services, when it built.
          prerelease: true
          files: ${{ steps.release-asset.outputs.files }}
      # A release can be created with the upload having quietly failed,
      # leaving a tag that looks published and a consumer that gets a 404.
      # Read the asset back rather than trusting that it uploaded.
      - name: Confirm the published assets are present and not empty
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.tag }}
          ASSETS: ${{ steps.release-asset.outputs.assets }}
        run: |
          set -euo pipefail
          for ASSET in ${ASSETS}; do
            export ASSET
            # jq takes the name from the environment rather than from the shell, so a
            # name needing escaping cannot break the filter. `uploaded` is the state
            # that matters: an asset stranded mid-upload still reports a size, which
            # is exactly the case this step exists to catch.
            # shellcheck disable=SC2016  # $ENV.ASSET is jq, and must not expand here
            size="$(gh release view "$TAG" --json assets \
              --jq '[.assets[] | select(.name == $ENV.ASSET and .state == "uploaded") | .size] | first // 0')"
            case "$size" in
              ''|*[!0-9]*)
                echo "::error::Could not read a size for $ASSET on $TAG"
                exit 1
                ;;
            esac
            if [ "$size" -le 0 ]; then
              echo "::error::$ASSET is missing, empty or unfinished on $TAG"
              gh release view "$TAG" --json assets \
                --jq '.assets[] | "\(.name) \(.size) \(.state)"' || true
              exit 1
            fi
            echo "$ASSET published on $TAG, $size bytes"
          done

      # A link that never changes, for anything that wants tonight's APK
      # without knowing tonight's tag. `releases/latest` cannot serve it: the
      # npm releases hold that slot, and it skips prereleases anyway. The tag
      # does not start with `android-`, so consumers that pick the newest
      # `android-*` prerelease never see it. Only main updates it, so a build
      # dispatched from another branch cannot replace what testers download.
      - name: Refresh the fixed nightly-android release
        if: github.ref == 'refs/heads/main'
        working-directory: hosts/android
        env:
          GH_TOKEN: ${{ github.token }}
          POINTER: nightly-android
          TAG: ${{ steps.release-tag.outputs.tag }}
          BUILD_ID: ${{ steps.setup.outputs.build_id }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ASSETS: ${{ steps.release-asset.outputs.assets }}
        run: |
          set -euo pipefail
          if ! gh release view "${POINTER}" >/dev/null 2>&1; then
            gh release create "${POINTER}" \
              --title "Android nightly (latest build)" \
              --notes "Created by the Android nightly." \
              --target "${GITHUB_SHA}" \
              --prerelease --latest=false
          fi
          # shellcheck disable=SC2086  # ASSETS is a space-separated list of names
          gh release upload "${POINTER}" ${ASSETS} --clobber
          # The tag follows the build, so the release's source archives and its
          # compare view match the APKs it carries.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${POINTER}" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          gh release edit "${POINTER}" --prerelease --latest=false --notes "$(cat <<EOF
          The latest Android nightly, refreshed by every run on main. These links never change:

          - \`app-gp-nightly.apk\`, the Google Play flavour
          - \`app-vanilla-nightly.apk\`, without Google Play services

          Currently build \`${VERSION_NAME} (${BUILD_ID})\` from \`${GITHUB_SHA}\`, the same APKs as [${TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}).
          EOF
          )"

      # Downloading through the fixed URLs is the only proof they serve
      # tonight's files rather than a stale or half-replaced asset.
      - name: Confirm the fixed links serve tonight's APKs
        if: github.ref == 'refs/heads/main'
        working-directory: hosts/android
        env:
          ASSETS: ${{ steps.release-asset.outputs.assets }}
        run: |
          set -euo pipefail
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/nightly-android"
          for asset in ${ASSETS}; do
            expected="$(sha256sum "${asset}" | cut -d' ' -f1)"
            if ! curl -fsSL "${base}/${asset}" -o "${RUNNER_TEMP}/${asset}"; then
              echo "::error::${base}/${asset} could not be downloaded"
              exit 1
            fi
            served="$(sha256sum "${RUNNER_TEMP}/${asset}" | cut -d' ' -f1)"
            if [ "${served}" != "${expected}" ]; then
              echo "::error::${base}/${asset} serves ${served}, expected tonight's ${expected}"
              exit 1
            fi
            echo "${base}/${asset} serves tonight's ${asset} (${served})"
          done


  # Announced the way the iOS nightly is, through the same relay and into the
  # same room.

  send-release-notification:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: nightly
    # Scheduled runs only. A dispatch builds whatever branch it was started
    # from and tags the prerelease with that branch's commit, while the pull
    # requests below are always read from the default branch, so a dispatched
    # announcement would pair one branch's APK with another branch's changelog.
    # Re-running a scheduled run keeps its original event, so a re-run after a
    # failed night still announces.
    if: github.event_name == 'schedule'
    # The build shipped to App Distribution and the prerelease is live before
    # this runs. A relay that is briefly unreachable should not turn that into
    # a failed night.
    continue-on-error: true
    timeout-minutes: 10
    # Narrower than the workflow default, which this job has no use for.
    # actions: read is what lets the step below find the run this one follows.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # The action below is held in this repository, so it has to be on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The range between this build and the one the last successful night
      # produced, which is the set of changes a tester receives with this APK.
      - name: Collect merged PRs
        id: collect_prs
        uses: ./.github/actions/collect-prs-since-last-build
        with:
          github_token: ${{ github.token }}
          # This job runs on the schedule alone, so a dispatched run announces
          # nothing. Anchoring on one would drop everything merged before it
          # from the next night's list, and nothing would ever report it.
          event: schedule
          # A scheduled night that skipped its build still ends in success, and
          # must not become the point the next night's list starts from.
          required_job: Build and publish

      - name: Send nightly release notification
        uses: novasamatech/github-actions/send-release-notification@8c20aeac07cb19b3c2ce1310d1ef2947a373ca5e # v5
        with:
          platform: Android
          # The template renders the heading either way, so a quiet night says
          # so rather than showing an empty list.
          pr_list: ${{ steps.collect_prs.outputs.release_notes != ''
            && steps.collect_prs.outputs.release_notes
            || '- No pull requests merged since the last nightly.' }}
          # What App Distribution shows a tester: the versionName the APK was
          # built with, and the build id that is its versionCode.
          release_info: |
            Nightly: ${{ needs.nightly.outputs.version_name }} (${{ needs.nightly.outputs.build_id }})
          # One entry per line, because the second is a sentence rather than a
          # link and reads badly joined onto the first.
          download_links_format: list
          # The asset is public, so the link is built here rather than held in a
          # secret the way the iOS one is. App Distribution has no fetchable URL,
          # only the tester app, so it gets a sentence instead of a link.
          download_links: |
            [APK](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.nightly.outputs.tag }}/app-gp-nightly.apk)
            ${{ needs.nightly.outputs.vanilla == 'built'
              && format('[Vanilla APK, without Google Play services]({0}/{1}/releases/download/{2}/app-vanilla-nightly.apk)', github.server_url, github.repository, needs.nightly.outputs.tag)
              || 'No vanilla APK tonight: its build failed.' }}
            Also distributed to Firebase App Distribution (${{ vars.ANDROID_FIREBASE_GROUP }}).
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ secrets.CI_MATRIX_ROOM_IDS }}
