name: Pull request triage

# Gives every pull request the two labels a reviewer scans the list by, so
# nobody has to triage by hand when it goes up. docs/labels.md has the system.
#
# - `size:` from the lines changed, so a large pull request is visible as one
#   before anyone opens it.
# - `status: waiting on review` on a pull request that is ready and says nothing
#   else about where it stands. Drafts get no status until they are marked
#   ready, and a draft loses this one if it goes back.
#
# pull_request_target, so a pull request from a fork can be labelled too. It
# never checks out the pull request's code: everything here reads the API.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Size and status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const number = pr.number;
            const action = context.payload.action;
            const labels = pr.labels.map(l => l.name);

            const add = async names => names.length && github.rest.issues.addLabels({
              owner, repo, issue_number: number, labels: names,
            });
            const remove = async name => github.rest.issues.removeLabel({
              owner, repo, issue_number: number, name,
            }).catch(e => { if (e.status !== 404) throw e; });

            // A backport is a vendored tree replaced wholesale, so its line
            // count says nothing about how much there is to review.
            const sizes = ['size: XS', 'size: S', 'size: M', 'size: L', 'size: XL', 'size: XXL'];
            if (labels.includes('type: backport')) {
              for (const s of labels.filter(l => sizes.includes(l))) await remove(s);
            } else {
              // Lines a reviewer does not read: whatever .gitattributes marks
              // linguist-generated, which GitHub collapses in the diff too, read
              // from the base branch so a pull request cannot shrink itself;
              // plus lockfiles and the database schemas the build writes.
              const glob = g => new RegExp('^' + g
                .replace(/[.+^${}()|[\]\\]/g, '\\$&')
                .replace(/\*\*/g, '\0')
                .replace(/\*/g, '[^/]*')
                .replace(/\0/g, '.*') + '$');
              let generated = [];
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: '.gitattributes', ref: pr.base.sha,
                });
                generated = Buffer.from(data.content, 'base64').toString()
                  .split('\n')
                  .map(line => line.trim().split(/\s+/))
                  .filter(([path, ...attrs]) => path && !path.startsWith('#')
                    && attrs.some(a => a === 'linguist-generated' || a === 'linguist-generated=true'))
                  .map(([path]) => glob(path));
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              const skipped = [
                ...generated,
                /(^|\/)(Cargo\.lock|package-lock\.json|yarn\.lock|bun\.lockb|Package\.resolved)$/,
                /(^|\/)database\/schemas\//,
                /\.xcdatamodeld?\//,
              ];
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const lines = files
                .filter(f => !skipped.some(re => re.test(f.filename)))
                .reduce((n, f) => n + f.additions + f.deletions, 0);
              const size = lines < 10 ? 'size: XS'
                : lines < 30 ? 'size: S'
                : lines < 100 ? 'size: M'
                : lines < 500 ? 'size: L'
                : lines < 1000 ? 'size: XL'
                : 'size: XXL';
              core.info(`${lines} reviewable lines: ${size}`);
              for (const s of labels.filter(l => sizes.includes(l) && l !== size)) await remove(s);
              if (!labels.includes(size)) await add([size]);
            }

            const waiting = 'status: waiting on review';
            if (action === 'converted_to_draft') {
              await remove(waiting);
            } else if (['opened', 'reopened', 'ready_for_review'].includes(action)
                && !pr.draft
                && !labels.some(l => l.startsWith('status: '))) {
              await add([waiting]);
            }
