name: Pull request triage

# Gives every pull request the two labels a reviewer scans the list by, so
# nobody has to triage by hand when it goes up. docs/labels.md has the system.
#
# - `size:` from the lines changed, so a large pull request is visible as one
#   before anyone opens it.
# - `status:` from the review decision: `ready-to-merge` once approved,
#   `waiting-on-author` when changes are requested, `waiting-on-review`
#   otherwise. `status:blocked` is set and cleared by hand and left alone.
#   Drafts carry no status until they are marked ready.
#
# pull_request_target, so a pull request from a fork can be labelled too. It
# never checks out the pull request's code: everything here reads the API.
# A review on a fork's pull request runs with a read-only token, so that one
# is skipped and the next push to it sets the status.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  # contents to read .gitattributes from the base branch.
  contents: read
  pull-requests: write
  issues: write

# A review run labels only the status, so it gets its own group and never
# cancels a run that is still setting the size.
concurrency:
  group: pr-triage-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Size and status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const number = pr.number;
            const labels = pr.labels.map(l => l.name);

            const review = context.eventName === 'pull_request_review';
            if (review && pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.info('Review on a fork: the token is read-only, so nothing to do.');
              return;
            }
            // A comment review does not change who acts next, and keeps a
            // status a reviewer set by hand.
            if (review && context.payload.action === 'submitted'
              && !['approved', 'changes_requested'].includes(context.payload.review.state)) {
              core.info('Comment review: status unchanged.');
              return;
            }

            const add = async names => names.length && github.rest.issues.addLabels({
              owner, repo, issue_number: number, labels: names,
            });
            const remove = async name => github.rest.issues.removeLabel({
              owner, repo, issue_number: number, name,
            }).catch(e => { if (e.status !== 404) throw e; });

            // A backport is a vendored tree replaced wholesale, so its line
            // count says nothing about how much there is to review.
            const sizes = ['size:XS', 'size:S', 'size:M', 'size:L', 'size:XL', 'size:XXL'];
            if (labels.includes('backport-host')) {
              for (const s of labels.filter(l => sizes.includes(l))) await remove(s);
            } else {
              // Lines a reviewer does not read: whatever .gitattributes marks
              // linguist-generated, which GitHub collapses in the diff too, read
              // from the base branch so a pull request cannot shrink itself;
              // plus lockfiles and the database schemas the build writes.
              // As git reads a .gitattributes pattern: one with no slash matches
              // at any depth, a leading slash anchors it to the root.
              const glob = g => {
                const anchored = g.includes('/');
                const body = g.replace(/^\//, '')
                  .replace(/[.+^${}()|[\]\\]/g, '\\$&')
                  .replace(/\*\*\//g, '\u0001')
                  .replace(/\*\*/g, '\0')
                  .replace(/\*/g, '[^/]*')
                  .replace(/\?/g, '[^/]')
                  .replace(/\u0001/g, '(.*/)?')
                  .replace(/\0/g, '.*');
                return new RegExp((anchored ? '^' : '(^|/)') + body + '$');
              };
              let generated = [];
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: '.gitattributes', ref: pr.base.sha,
                });
                generated = Buffer.from(data.content, 'base64').toString()
                  .split('\n')
                  .map(line => line.trim().split(/\s+/))
                  .filter(([path, ...attrs]) => path && !path.startsWith('#')
                    && attrs.some(a => a === 'linguist-generated' || a === 'linguist-generated=true'))
                  .map(([path]) => glob(path));
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              const skipped = [
                ...generated,
                /(^|\/)(Cargo\.lock|package-lock\.json|yarn\.lock|bun\.lockb|Package\.resolved)$/,
                /(^|\/)database\/schemas\//,
                /\.xcdatamodeld?\//,
              ];
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const lines = files
                .filter(f => !skipped.some(re => re.test(f.filename)))
                .reduce((n, f) => n + f.additions + f.deletions, 0);
              const size = lines < 10 ? 'size:XS'
                : lines < 30 ? 'size:S'
                : lines < 100 ? 'size:M'
                : lines < 500 ? 'size:L'
                : lines < 1000 ? 'size:XL'
                : 'size:XXL';
              core.info(`${lines} reviewable lines: ${size}`);
              for (const s of labels.filter(l => sizes.includes(l) && l !== size)) await remove(s);
              if (!labels.includes(size)) await add([size]);
            }

            // Decided from the pull request's state rather than the event, so a
            // run cancelled by the next one leaves nothing the next run misses.
            const managed = {
              review: 'status:waiting-on-review',
              author: 'status:waiting-on-author',
              ready: 'status:ready-to-merge',
            };
            if (labels.includes('status:blocked')) {
              core.info('Blocked: status left to whoever set it.');
              return;
            }
            let want = null;
            if (!pr.draft) {
              const { repository } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewDecision
                      latestOpinionatedReviews(first: 100) { nodes { state } }
                    }
                  }
                }`, { owner, repo, number });
              // reviewDecision is null where the base branch requires no
              // review, so the latest approval or change request decides.
              const { reviewDecision, latestOpinionatedReviews } = repository.pullRequest;
              const states = latestOpinionatedReviews.nodes.map(r => r.state);
              const decision = reviewDecision
                ?? (states.includes('CHANGES_REQUESTED') ? 'CHANGES_REQUESTED'
                  : states.includes('APPROVED') ? 'APPROVED'
                  : null);
              want = decision === 'APPROVED' ? managed.ready
                : decision === 'CHANGES_REQUESTED' ? managed.author
                : managed.review;
              core.info(`Review decision ${decision}: ${want}`);
            }
            for (const l of labels.filter(l => Object.values(managed).includes(l) && l !== want)) {
              await remove(l);
            }
            if (want && !labels.includes(want)) await add([want]);
