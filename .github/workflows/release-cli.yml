# Publishes the prebuilt truapi-host binaries cli-package.yml builds.
#
# Assets land on the existing `@parity/truapi@<version>` release, because the
# CLI crate version tracks the protocol version. A separate rolling release,
# `truapi-host-cli-stable`, carries the `version` asset that the installer and
# the in-binary updater read to answer "what is the latest?" — the repo's npm
# releases dominate `releases/latest`, so that endpoint is unusable here.
name: release-cli

on:
  # release.yml calls this for a `release: @parity/truapi <version>` commit
  # subject, so the release flow and a manual publish build binaries the same way.
  workflow_call:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string
      ref:
        description: "Commit to build, since a called workflow does not inherit the caller's checkout"
        required: true
        type: string
  # Manual escape hatch. There is deliberately no tag trigger: a tag push
  # cannot use release.yml's workflow_run gate on green CI, so it would be an
  # unverified path to a published binary.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.10.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
    uses: ./.github/workflows/cli-package.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref || github.sha }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The pointer is written only after every archive is live, so it can never
      # advertise a version whose binaries are missing.
      - name: Publish the archives, then move the stable pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          # release.yml normally creates this release first; --target matters
          # only when it did not, so the tag still lands on the release commit
          # rather than wherever the default branch has moved to.
          RELEASE_REF: ${{ inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          tag="@parity/truapi@${VERSION}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "@parity/truapi ${VERSION}" \
              --target "${RELEASE_REF}" \
              --generate-notes
          fi
          gh release upload "${tag}" dist/* --clobber

          printf '%s\n' "${VERSION}" > version
          if ! gh release view truapi-host-cli-stable >/dev/null 2>&1; then
            gh release create truapi-host-cli-stable \
              --title "truapi-host CLI stable pointer" \
              --notes "Names the truapi-host version the installer and the in-binary updater install. Not a release of its own; the binaries live on the matching @parity/truapi release." \
              --latest=false
          fi
          gh release upload truapi-host-cli-stable version --clobber

      # Downloading through the documented URLs is the only proof the
      # percent-encoded tag path resolves and the digests survived upload.
      - name: Verify the published assets are installable
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPOSITORY}"
          published="$(curl -fsSL "${base}/releases/download/truapi-host-cli-stable/version" | tr -d '[:space:]')"
          [ "${published}" = "${VERSION}" ] \
            || { echo "::error::pointer says '${published}'"; exit 1; }
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            name="truapi-host-${VERSION}-${target}.tar.gz"
            url="${base}/releases/download/%40parity%2Ftruapi%40${VERSION}/${name}"
            curl -fsSL "${url}" -o "${name}"
            curl -fsSL "${url}.sha256" -o "${name}.sha256"
            sha256sum -c "${name}.sha256"
          done
