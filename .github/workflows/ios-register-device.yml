name: Register device

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: "Device name (e.g. John's iPhone)"
        required: true
        type: string
      device_udid:
        description: "Device UDID (40-char hex or 24-char with dash for newer devices)"
        required: true
        type: string

jobs:
  register_device:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Registering a device mutates signing state at Apple and spends one of a
      # limited number of device slots.
      # Narrower than write access: see the action for why, and
      # IOS_SIGNING_ACTORS for who.
      - name: Require an iOS signing actor
        uses: ./.github/actions/require-ios-signing-actor
        with:
          allowed: ${{ vars.IOS_SIGNING_ACTORS }}
          actor: ${{ github.triggering_actor }}

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install

      - name: Register device
        working-directory: hosts/ios
        run: bundle exec fastlane register name:"$DEVICE_NAME" udid:"$DEVICE_UDID"
        env:
          DEVICE_NAME: ${{ inputs.device_name }}
          DEVICE_UDID: ${{ inputs.device_udid }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
