# Opens a "bump TrUAPI" issue on every repository listed in
# .github/consumers.json that consumes a package the release published, and
# closes the notifications the new one supersedes. Routing and issue content
# live in scripts/lib/consumer-notifications.mjs.
name: notify-consumers

on:
  # release.yml calls this with the subset of packages that reached npm, so
  # nothing is announced before it is actually installable.
  workflow_call:
    inputs:
      published:
        description: "Confirmed `name|path|version|tag` block from release.yml"
        required: true
        type: string
      ref:
        description: "Commit to read the consumer config from, since a called workflow does not inherit the caller's checkout"
        required: true
        type: string
    secrets:
      CONSUMER_APP_ID:
        required: true
      CONSUMER_APP_KEY:
        required: true
  # Rehearsal. Point target_repo at a scratch repository to see the real
  # issue, label and supersede behaviour without touching a consumer. The app
  # has to be installed on that repository, so it must be one of ours.
  workflow_dispatch:
    inputs:
      published:
        description: "`name|path|version|tag` lines, e.g. @parity/truapi||0.10.0|@parity/truapi@0.10.0"
        required: true
        type: string
      target_repo:
        description: "Send everything to this owner/name instead of the consumer config"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notify-consumers
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The token is scoped to the repositories this run will actually write
      # to, so it carries no reach over the rest of the installation.
      - name: Resolve the repositories to write to
        id: targets
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_REPO}" ]; then
            names="${TARGET_REPO#*/}"
          else
            names="$(jq -r '[.[][]] | unique | map(sub("^[^/]+/"; "")) | join(",")' .github/consumers.json)"
          fi
          if [ -z "${names}" ]; then
            echo "::error::No consumer repositories resolved; refusing to mint a broader token."
            exit 1
          fi
          echo "repositories=${names}" >> "$GITHUB_OUTPUT"

      # `owner` must be set alongside `repositories`, or the minted token
      # reaches nothing but truapi itself. `permission-issues` holds it to what
      # the script does, whatever else the app is granted. `app-id` takes the
      # app's numeric id; the action prefers `client-id` and warns about this
      # one, which needs the app's client id to switch to.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CONSUMER_APP_ID }}
          private-key: ${{ secrets.CONSUMER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-issues: write

      - name: Announce the release
        env:
          CONSUMER_NOTIFY_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISHED: ${{ inputs.published }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET_REPO}" ]; then
            printf '%s' "${PUBLISHED}" | node scripts/notify-consumers.mjs --repo "${TARGET_REPO}"
          else
            printf '%s' "${PUBLISHED}" | node scripts/notify-consumers.mjs
          fi
