name: Reusable Prepare Pipeline

on:
  workflow_call:
    inputs:
      is_nightly:
        required: true
        type: boolean
      bump_level:
        required: false
        type: string
        default: "no-bump"
      source_ref:
        required: false
        type: string
        default: "main"
      increment_step:
        required: false
        type: string
        default: ""
      distribution_workflow:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  PBXPROJ_PATH: hosts/ios/polkadot-app.xcodeproj/project.pbxproj
  SOURCE_REF: ${{ inputs.source_ref }}
  MAIN_BRANCH: main

jobs:
  prepare_release:
    name: Bump MARKETING_VERSION, create PR, and trigger distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # A scheduled nightly is started by nobody, so there is no one to check.
      # Narrower than write access: see the action for why, and
      # IOS_SIGNING_ACTORS for who.
      - name: Require an iOS signing actor
        if: github.event_name != 'schedule'
        uses: ./.github/actions/require-ios-signing-actor
        with:
          allowed: ${{ vars.IOS_SIGNING_ACTORS }}
          actor: ${{ github.triggering_actor }}

      # The later `git checkout -b` switches the working tree to source_ref, which may
      # carry different script versions — keep the ones from the workflow's own commit.
      - name: Cache workflow scripts from this commit
        id: cache_scripts
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          cp -R hosts/ios/.github/scripts "${TMP_DIR}/scripts"
          echo "SCRIPTS_DIR=${TMP_DIR}/scripts" >> "$GITHUB_ENV"
          echo "Cached scripts at ${TMP_DIR}/scripts"

      - name: Read and validate versions from Xcode project
        id: read_version
        shell: bash
        run: |
          set -euo pipefail
          python3 "${SCRIPTS_DIR}/read_versions.py" "${PBXPROJ_PATH}" \
            --config-name "Release" \
            --output-format env > version_info.txt
          source version_info.txt
          echo "Found current MARKETING_VERSION: ${marketing_version}"
          {
            echo "current_version=${marketing_version}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "patch=${patch}"
            echo "has_patch=${has_patch}"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: bump_version
        env:
          BUMP_LEVEL: ${{ inputs.bump_level }}
          CURRENT_VERSION: ${{ steps.read_version.outputs.current_version }}
          CUR_MAJOR: ${{ steps.read_version.outputs.major }}
          CUR_MINOR: ${{ steps.read_version.outputs.minor }}
          CUR_PATCH: ${{ steps.read_version.outputs.patch }}
          CUR_HAS_PATCH: ${{ steps.read_version.outputs.has_patch }}
        shell: bash
        run: |
          set -euo pipefail
          LEVEL="${BUMP_LEVEL:-no-bump}"
          MAJOR="${CUR_MAJOR:-0}"
          MINOR="${CUR_MINOR:-0}"
          PATCH="${CUR_PATCH:-0}"
          HAS_PATCH="${CUR_HAS_PATCH:-false}"
          if [[ "${LEVEL}" == "major" ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [[ "${LEVEL}" == "minor" ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif [[ "${LEVEL}" == "patch" ]]; then
            PATCH=$((PATCH + 1))
          else
            echo "Version will not be changed (bump_level: ${LEVEL})"
          fi
          INCLUDE_PATCH="${HAS_PATCH}"
          if [[ "${LEVEL}" == "patch" ]]; then
            INCLUDE_PATCH="true"
          fi
          BASE_VERSION="${MAJOR}.${MINOR}"
          if [[ "${INCLUDE_PATCH}" == "true" ]]; then
            NEW_VERSION="${BASE_VERSION}.${PATCH}"
          else
            NEW_VERSION="${BASE_VERSION}"
          fi
          TIMESTAMP="$(date -u +%Y%m%d%H%M)"
          BRANCH_NAME="release/release-${NEW_VERSION}-${TIMESTAMP}"
          VERSION_CHANGED=$([[ "${LEVEL}" != "no-bump" ]] && echo "true" || echo "false")
          {
            echo "new_version=${NEW_VERSION}"
            echo "branch_name=${BRANCH_NAME}"
            echo "version_changed=${VERSION_CHANGED}"
          } >> "$GITHUB_OUTPUT"
          echo "Calculated new version: ${NEW_VERSION}"
          echo "Branch to create: ${BRANCH_NAME}"

      - name: Decide whether to release
        id: decide
        shell: bash
        env:
          IS_NIGHTLY: ${{ inputs.is_nightly }}
          BUMP_LEVEL: ${{ inputs.bump_level }}
        run: |
          set -euo pipefail
          SRC="${SOURCE_REF}"
          if [[ -z "${SRC}" ]]; then
            echo "::error::SOURCE_REF is not set or empty"; exit 1
          fi
          if git rev-parse --verify --quiet "refs/remotes/origin/${SRC}" >/dev/null; then
            REF="refs/remotes/origin/${SRC}"
          elif git rev-parse --verify --quiet "${SRC}^{commit}" >/dev/null; then
            REF="${SRC}"
          else
            echo "::error::Invalid source_ref '${SRC}': must be an existing branch name or commit SHA"; exit 1
          fi
          # Release builds from main go straight to distribution: main is already
          # released code, so there is no release branch and no PR to merge back.
          DIRECT_BUILD="false"
          if [[ "${SRC}" == "${MAIN_BRANCH}" ]]; then
            if [[ "${BUMP_LEVEL:-no-bump}" != "no-bump" ]]; then
              echo "::error::Version bump needs a release branch/PR to land the bump commit. Use bump_level 'no-bump' when building directly from ${MAIN_BRANCH}."
              exit 1
            fi
            DIRECT_BUILD="true"
          fi
          COMMITS_AHEAD=$(git rev-list --count "origin/${MAIN_BRANCH}..${REF}")
          echo "Commits ahead of ${MAIN_BRANCH}: ${COMMITS_AHEAD}"
          HAS_CHANGES=$([[ "${COMMITS_AHEAD}" -gt 0 ]] && echo "true" || echo "false")
          # Counting commits ahead of the main branch only says anything when the
          # source is something else. Building from the main branch compares it
          # with itself and always reports zero, which silently turned every
          # nightly into a no-op.
          if [[ "${DIRECT_BUILD}" == "true" ]]; then
            SHOULD_RELEASE="true"
          elif [[ "${HAS_CHANGES}" == "true" ]]; then
            SHOULD_RELEASE="true"
          elif [[ "${IS_NIGHTLY}" == "true" ]]; then
            SHOULD_RELEASE="false"
          else
            SHOULD_RELEASE="true"
          fi
          {
            echo "resolved_ref=${REF}"
            echo "has_changes=${HAS_CHANGES}"
            echo "should_release=${SHOULD_RELEASE}"
            echo "direct_build=${DIRECT_BUILD}"
          } >> "$GITHUB_OUTPUT"
          if [[ "${DIRECT_BUILD}" == "true" ]]; then
            echo "::notice::Building directly from ${MAIN_BRANCH} — no release branch or PR will be created."
          elif [[ "${SHOULD_RELEASE}" == "false" ]]; then
            echo "::notice::No changes since ${MAIN_BRANCH} and this is a nightly run — skipping build."
          fi

      - name: Create release branch from source ref
        if: steps.decide.outputs.should_release == 'true' && steps.decide.outputs.direct_build != 'true'
        shell: bash
        env:
          RESOLVED_REF: ${{ steps.decide.outputs.resolved_ref }}
          HAS_CHANGES: ${{ steps.decide.outputs.has_changes }}
          RB: ${{ steps.bump_version.outputs.branch_name }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/remotes/origin/${RB}" >/dev/null; then
            echo "::error::Release branch '${RB}' already exists on origin"; exit 1
          fi
          if git rev-parse --verify --quiet "${RB}" >/dev/null; then
            echo "::error::Release branch '${RB}' already exists locally"; exit 1
          fi
          if [[ "${HAS_CHANGES}" == "true" ]]; then
            echo "=== Commits to be included in this release ==="
            git log --oneline "origin/${MAIN_BRANCH}..${RESOLVED_REF}"
            echo "=============================================="
          else
            echo "::warning::No new commits relative to ${MAIN_BRANCH}. Releasing with a placeholder."
          fi
          echo "Creating branch ${RB} from ${RESOLVED_REF}"
          git checkout -b "${RB}" "${RESOLVED_REF}"

      - name: Update MARKETING_VERSION in Xcode project (Release & Nightly)
        if: >-
          steps.decide.outputs.should_release == 'true' &&
          steps.decide.outputs.direct_build != 'true' &&
          steps.bump_version.outputs.version_changed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
        run: |
          set -euo pipefail
          echo "Updating MARKETING_VERSION in Release configuration..."
          python3 "${SCRIPTS_DIR}/update_marketing_version.py" "${PBXPROJ_PATH}" "${NEW_VERSION}" --config-name "Release"
          echo "Updating MARKETING_VERSION in Nightly configuration..."
          python3 "${SCRIPTS_DIR}/update_marketing_version.py" "${PBXPROJ_PATH}" "${NEW_VERSION}" --config-name "Nightly"
          echo "Updating MARKETING_VERSION in Safetynet configuration..."
          python3 "${SCRIPTS_DIR}/update_marketing_version.py" "${PBXPROJ_PATH}" "${NEW_VERSION}" --config-name "Safetynet"

      - name: Commit changes and push branch
        if: steps.decide.outputs.should_release == 'true' && steps.decide.outputs.direct_build != 'true'
        env:
          BRANCH_NAME: ${{ steps.bump_version.outputs.branch_name }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
          VERSION_CHANGED: ${{ steps.bump_version.outputs.version_changed }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "${VERSION_CHANGED}" == "true" ]]; then
            git add "${PBXPROJ_PATH}"
            if git diff --cached --quiet; then
              echo "No changes to commit (MARKETING_VERSION already at ${NEW_VERSION})."
            else
              git commit -m "chore(release): bump MARKETING_VERSION to ${NEW_VERSION}"
            fi
          else
            echo "Version not changed (bump_level: no-bump), skipping MARKETING_VERSION commit"
          fi
          # Guarantee the branch is ahead of main so a PR can be opened even with no changes.
          if [[ "$(git rev-list --count "origin/${MAIN_BRANCH}..HEAD")" -eq 0 ]]; then
            git commit --allow-empty -m "chore(release): no changes"
            echo "Created placeholder commit (no changes relative to ${MAIN_BRANCH})"
          fi
          git push --set-upstream origin "${BRANCH_NAME}"
          echo "Pushed branch ${BRANCH_NAME}"

      - name: Collect PRs info
        id: collect-prs
        if: steps.decide.outputs.should_release == 'true' && steps.decide.outputs.direct_build != 'true'
        uses: novasamatech/github-actions/collect-prs@8c20aeac07cb19b3c2ce1310d1ef2947a373ca5e # v5
        with:
          github_token: ${{ github.token }}
          src_ref: ${{ steps.bump_version.outputs.branch_name }}
          dst_ref: ${{ env.MAIN_BRANCH }}

      - name: Create Pull Request to main
        id: create_pr
        if: steps.decide.outputs.should_release == 'true' && steps.decide.outputs.direct_build != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BRANCH_NAME: ${{ steps.bump_version.outputs.branch_name }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
          RELEASE_NOTES: ${{ steps.collect-prs.outputs.release_notes }}
          PR_COUNT: ${{ steps.collect-prs.outputs.pr_count }}
          MAIN_BRANCH: ${{ env.MAIN_BRANCH }}
          INCREMENT_STEP: ${{ inputs.increment_step }}
          IS_NIGHTLY: ${{ inputs.is_nightly }}
        with:
          github-token: ${{ github.token }}
          script: |
            const branchName = process.env.BRANCH_NAME;
            const newVersion = process.env.NEW_VERSION;
            const releaseNotes = process.env.RELEASE_NOTES || '';
            const numberOfMergedPrs = process.env.PR_COUNT || '0';
            const sourceRef = process.env.SOURCE_REF;
            const incrementStep = process.env.INCREMENT_STEP || '';
            const nightlyBuild = process.env.IS_NIGHTLY === 'true';

            console.log(`Creating PR for branch: ${branchName}`);
            console.log('Waiting 3 seconds for branch to sync...');
            await new Promise(resolve => setTimeout(resolve, 3000));

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(`Branch ${branchName} exists`);
            } catch (error) {
              core.setFailed(`Branch ${branchName} not found: ${error.message}`);
              return;
            }

            const prBody = `${newVersion} release.

            ${numberOfMergedPrs} pull requests were merged.

            Merged pull requests:
            ${releaseNotes}

            ---
            <!-- DO NOT EDIT THE METADATA BELOW - Used for automated backport -->
            <!-- RELEASE_METADATA: source_ref=${sourceRef} -->
            <!-- RELEASE_METADATA: nightly_build=${nightlyBuild} -->
            <!-- RELEASE_METADATA: increment_step=${incrementStep} -->`;

            const prTitle = nightlyBuild
              ? `release(ios): ${newVersion} (nightly)`
              : `release(ios): ${newVersion}`;
            const mainBranch = process.env.MAIN_BRANCH;

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: prTitle,
                head: branchName,
                base: mainBranch,
                body: prBody
              });
              console.log(`Created PR: ${pr.html_url}`);
              core.setOutput('pull_request_url', pr.html_url);
              core.setOutput('pull_request_number', pr.number);
            } catch (error) {
              core.setFailed(`Failed to create PR: ${error.message}`);
            }

      - name: Trigger distribution workflow
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DIRECT_BUILD: ${{ steps.decide.outputs.direct_build }}
          BRANCH_NAME: ${{ steps.bump_version.outputs.branch_name }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull_request_number }}
          DISTRIBUTION_WORKFLOW: ${{ inputs.distribution_workflow }}
          INCREMENT_STEP: ${{ inputs.increment_step }}
        with:
          github-token: ${{ github.token }}
          script: |
            const directBuild = process.env.DIRECT_BUILD === 'true';
            const branchName = directBuild ? process.env.MAIN_BRANCH : process.env.BRANCH_NAME;
            const prNumber = directBuild ? '' : process.env.PR_NUMBER;
            const workflowId = process.env.DISTRIBUTION_WORKFLOW;
            const workflowRef = '${{ github.ref_name }}';
            const dispatchInputs = {
              release_branch: branchName,
              release_pr_number: prNumber
            };
            if (directBuild) {
              // No PR to carry increment_step metadata — pass it explicitly.
              dispatchInputs.increment_step = process.env.INCREMENT_STEP || '';
            }
            const target = directBuild ? '(direct build, no PR)' : `PR #${prNumber}`;
            console.log(`Triggering ${workflowId} for branch ${branchName} ${target}`);
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: workflowRef,
                inputs: dispatchInputs
              });
              console.log('Distribution workflow triggered successfully');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              // A ref that does not carry the workflow yet is the one case
              // worth tolerating. On the default branch it always carries it,
              // so a 404 there means the name is wrong and the pipeline has
              // dispatched nothing while reporting success.
              if (workflowRef === context.payload.repository.default_branch) {
                core.setFailed(`${workflowId} not found on ${workflowRef}; nothing was dispatched.`);
              } else {
                core.warning(`${workflowId} not found in ref ${workflowRef}; it will resolve once that ref carries it.`);
              }
            }
