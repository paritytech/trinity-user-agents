name: Nightly Distribution
# The run is always dispatched on main, whatever it builds, so the ref it built
# is recorded here. The nightly's changed check matches on it to tell a build of
# main apart from one of a release branch.
run-name: Nightly Distribution (${{ inputs.release_branch }})

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to build from"
        required: true
        type: string
      release_pr_number:
        description: "Release PR number, empty for a direct build"
        required: false
        default: ""
        type: string
      increment_step:
        description: "Build number increment step for direct builds (1 if empty)"
        required: false
        default: ""
        type: string

jobs:
  build_nightly:
    uses: ./.github/workflows/ios-build-distribute.yml
    with:
      release_branch: ${{ inputs.release_branch }}
      release_pr_number: ${{ inputs.release_pr_number }}
      increment_step: ${{ inputs.increment_step || '' }}
      build_configuration: "Nightly"
      distribute_to_external_group: true
      external_group_name: "Daily test builds"
    secrets:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      FASTLANE_RO_PAT: ${{ secrets.FASTLANE_RO_PAT }}
      GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
      GOOGLE_SERVICE_INFO_RELEASE_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_RELEASE_BASE64 }}
      GOOGLE_SERVICE_INFO_SAFETY_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_SAFETY_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
      NOTIFICATION_BOT_TOKEN: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
      NOTIFICATION_BOT_URL: ${{ secrets.NOTIFICATION_BOT_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  # The same commit as the TestFlight build, published as a release asset so a
  # build is downloadable without being a registered tester. Runs alongside the
  # TestFlight leg, so it costs the night no wall-clock, and a failure here
  # leaves the announcement to report the TestFlight build on its own.
  build_simulator:
    name: Simulator bundle
    uses: ./.github/workflows/ios-nightly-simulator-release.yml
    with:
      ref: ${{ inputs.release_branch }}
    secrets:
      GOOGLE_SERVICE_INFO_RELEASE_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_RELEASE_BASE64 }}
      MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  # The Safetynet leg of a nightly, kept as a job here rather than as a dispatch of another
  # workflow, which would race the branch deletion.
  #
  # Safetynet is what Release ships — release feature set — running against the nightly
  # environment, under its own bundle id so it installs alongside the real app. See
  # Configs/base.safetynet.xcconfig.
  build_safetynet:
    # Safetynet ships from the app repository. Held here rather than left to
    # be refused by ios-build-distribute, because a refusal fails the job and
    # every nightly run would be red with the two jobs after it skipped.
    if: false
    uses: ./.github/workflows/ios-build-distribute.yml
    with:
      release_branch: ${{ inputs.release_branch }}
      release_pr_number: ${{ inputs.release_pr_number }}
      build_configuration: "Safetynet"
      distribute_to_external_group: true
      external_group_name: "Daily test builds"
    secrets:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      FASTLANE_RO_PAT: ${{ secrets.FASTLANE_RO_PAT }}
      GOOGLE_SERVICE_INFO_DEV_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_BASE64 }}
      GOOGLE_SERVICE_INFO_RELEASE_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_RELEASE_BASE64 }}
      GOOGLE_SERVICE_INFO_SAFETY_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_SAFETY_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
      NOTIFICATION_BOT_TOKEN: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
      NOTIFICATION_BOT_URL: ${{ secrets.NOTIFICATION_BOT_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  auto_merge:
    name: Auto-merge nightly build PR
    runs-on: ubuntu-latest
    needs: [build_nightly]
    # A build straight from the main branch carries no release branch and no
    # pull request, so there is nothing here to merge.
    if: >-
      ${{ !cancelled() &&
      needs.build_nightly.outputs.succeeded == 'true' &&
      inputs.release_pr_number != '' }}
    steps:
      - name: Merge PR and delete branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = parseInt('${{ inputs.release_pr_number }}', 10);
            console.log(`Auto-merging nightly build PR #${prNumber}...`);
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              console.log(`PR #${prNumber} merged successfully`);

              const branch = '${{ inputs.release_branch }}';
              console.log(`Deleting release branch: ${branch}`);
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                console.log(`Deleted branch ${branch}`);
              } catch (deleteError) {
                if (deleteError.status === 422) {
                  console.log(`Branch ${branch} already deleted`);
                } else {
                  console.log(`Warning: failed to delete branch ${branch}: ${deleteError.message}`);
                }
              }
            } catch (error) {
              core.warning(`Failed to merge PR #${prNumber}: ${error.message}`);
            }

  send-release-notification:
    name: Send Release Notification
    runs-on: ubuntu-latest
    # The build shipped to TestFlight before this runs. A relay that is
    # briefly unreachable should not turn that into a failed run.
    continue-on-error: true
    # build_simulator is a dependency so its link can be carried, not a
    # condition: !cancelled() keeps this running when that leg failed, and the
    # download line says so instead of the announcement being lost with it.
    needs: [build_nightly, build_simulator]
    if: >-
      ${{ !cancelled() &&
      needs.build_nightly.outputs.succeeded == 'true' }}
    steps:
      # The action prints the message it renders. It rewrites the markdown entry
      # the secret holds into an anchor, so what reaches the log is the bare URL,
      # a substring of the secret rather than its value, and nothing redacts it.
      # This repository is public, so registering the URL masks it for the rest
      # of the job.
      - name: Mask the join link
        env:
          LINK: ${{ secrets.TESTFLIGHT_DISTRIBUTION_LINK }}
        run: |
          set -euo pipefail
          urls="$(printf '%s' "$LINK" | grep -oE 'https?://[^)[:space:]]+' | sort -u || true)"
          if [ -z "${urls}" ]; then
            echo "::warning::TESTFLIGHT_DISTRIBUTION_LINK holds no URL, so the announcement will carry no download"
            exit 0
          fi
          while IFS= read -r url; do
            [ -n "${url}" ] && echo "::add-mask::${url}"
          done <<< "${urls}"

      - name: Send nightly release notification
        uses: novasamatech/github-actions/send-release-notification@8c20aeac07cb19b3c2ce1310d1ef2947a373ca5e # v5
        with:
          platform: iOS
          # The template renders the heading either way, so an empty range says
          # so rather than showing an empty list.
          pr_list: ${{ needs.build_nightly.outputs.pr_list_markdown != ''
            && needs.build_nightly.outputs.pr_list_markdown
            || '- No pull requests merged since the last nightly.' }}
          release_info: |
            Nightly: ${{ needs.build_nightly.outputs.marketing_version }} (${{ needs.build_nightly.outputs.build_number }})
          # One entry per line, because there are two of them and they install
          # onto different things.
          download_links_format: list
          # The TestFlight secret holds a ready-to-render markdown entry, label
          # included, so that an access hint stays out of this public repo. The
          # simulator asset is public, so its link is built here the way the
          # Android APK's is. Safetynet ships from the app repository and no web
          # page link is configured, so those two are the whole list.
          download_links: |
            ${{ secrets.TESTFLIGHT_DISTRIBUTION_LINK }}
            ${{ needs.build_simulator.outputs.download_url != ''
              && format('[Simulator .app]({0})', needs.build_simulator.outputs.download_url)
              || 'No simulator bundle for this build: that leg did not finish.' }}
          bot_url: ${{ secrets.NOTIFICATION_BOT_URL }}
          bot_api_token: ${{ secrets.NOTIFICATION_BOT_TOKEN }}
          matrix_room_ids: ${{ secrets.CI_MATRIX_ROOM_IDS }}
