name: Refresh Stack Descriptors

# Refresh the stack descriptors host builds bundle (`stacks/`; how the CLI uses them:
# rust/crates/truapi-host-cli/SPEC.md §14.1) from the known stacks in
# rust/crates/trinity-stack/known-stacks.json.
on:
  schedule:
    # Daily at 01:00 UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Stack Descriptors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The released truapi-host bundles the stacks, so a change to what `stack bundle`
      # compares or pins applies here one release later.
      - name: Install truapi-host
        uses: ./.github/actions/install-truapi-host
        with:
          version: latest

      # A stack that fails to refresh still opens the PR with what did refresh, and leaves the
      # run red.
      - name: Refresh stack descriptors
        run: bash scripts/update-stacks.sh

      - name: Check for changes
        id: diff
        if: ${{ !cancelled() }}
        run: |
          if [ -z "$(git status --porcelain -- stacks/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write changeset
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        run: bash scripts/write-refresh-changeset.sh "$GITHUB_RUN_ID"

      - name: Create Pull Request
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore: refresh bundled stack descriptors"
          body: |
            Automated refresh of the stack descriptors bundled in truapi-host and the host apps
            (`stacks/`), with the changeset they need.

            This branch is rebuilt from main on every run, so a commit pushed to it is lost on the
            next one: make a fix in this PR only to merge it before the next run, or on main.
            The newest head can also end up with no checks attached even though earlier ones had
            them. If none are shown below, push an empty commit before merging rather than
            assuming the suite passed.

            If `test_built_in_network_hosts` fails, a stack moved an endpoint: confirm the new
            host is a test network before adding it to `TEST_NETWORK_HOSTS` in
            `rust/crates/truapi-host-cli/src/network/tests.rs`.

            If `test_light_client_catalog_match` fails, a stack restarted from genesis: edit
            `genesis_hex` in `rust/crates/truapi-provider/src/networks.rs` in this same PR, and run
            the Refresh Chain Specs workflow for the new light-client specs.

            Users get a refreshed stack descriptor with the next truapi-host release.
          branch: auto/stack-update
          commit-message: "chore: refresh bundled stack descriptors"
          delete-branch: true
          labels: dependencies
          reviewers: mordamax
