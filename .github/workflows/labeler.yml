# Applies labels from the paths a pull request touches, so triage does not depend
# on someone remembering. Configuration lives in .github/labeler.yml.
name: labeler

# pull_request_target so labels can be applied to pull requests from forks. This
# runs the base branch's configuration and checks out no pull request code, which
# is what makes that trigger safe here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
