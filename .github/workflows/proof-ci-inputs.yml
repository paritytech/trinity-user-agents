name: Proof (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  require-inputs:
    name: require_inputs with no values fails at decode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Android build with nothing to decode
        id: setup
        continue-on-error: true
        uses: ./.github/actions/setup-android-build
        with:
          require_inputs: "true"
      - name: Expect the decode step to have failed
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "setup outcome: ${OUTCOME}"
          test "${OUTCOME}" = failure

  dispatch-inputs:
    name: hostile dispatch inputs stay data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the inputs as the distribution workflow does
        env:
          GROUPS_INPUT: ios-external-team
          NOTES_INPUT: "Fix \"login\" $(whoami)\nINJECTED=evil\nline 3"
        run: |
          set -euo pipefail
          NOTES_INPUT="$(printf '%b' "${NOTES_INPUT}")"
          case "${GROUPS_INPUT}" in
            *$'\n'* | *$'\r'*)
              echo "::error::groups must be a single line."
              exit 1
              ;;
          esac
          delimiter="notes_$(openssl rand -hex 16)"
          {
            printf 'FIREBASE_GROUPS=%s\n' "${GROUPS_INPUT}"
            printf 'RELEASE_NOTES<<%s\n%s\n%s\n' "${delimiter}" "${NOTES_INPUT}" "${delimiter}"
          } >> "$GITHUB_ENV"
      - name: Expect the notes intact and nothing injected
        run: |
          set -euo pipefail
          printf 'groups=%s\nnotes:\n%s\n' "${FIREBASE_GROUPS}" "${RELEASE_NOTES}"
          test "${FIREBASE_GROUPS}" = ios-external-team
          # shellcheck disable=SC2016
          test "${RELEASE_NOTES}" = "$(printf 'Fix "login" $(whoami)\nINJECTED=evil\nline 3')"
          test -z "${INJECTED:-}"
      - name: Expect a multi-line groups value to fail
        env:
          GROUPS_INPUT: "a\nINJECTED=evil"
        run: |
          GROUPS_INPUT="$(printf '%b' "${GROUPS_INPUT}")"
          case "${GROUPS_INPUT}" in
            *$'\n'* | *$'\r'*) echo "refused as expected"; exit 0 ;;
          esac
          echo "::error::a multi-line groups value was accepted"
          exit 1
