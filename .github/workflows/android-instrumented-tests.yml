# Instrumented tests, which need a booted emulator and so cannot run on every
# commit: the runner is macOS, which bills at several times the Linux rate on a
# public repository, and a cold emulator costs minutes before the first test.
#
# Started by a label rather than by every push, and by dispatch so the workflow
# itself can be exercised without opening a pull request to carry the label.
name: Android instrumented tests

on:
  pull_request:
    # `labeled` starts it. The rest keep it on the branch's current commit
    # once the label is applied, rather than pinned to whichever commit was
    # head when someone asked, and cover a request opened or reopened with
    # the label already on it.
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Instrumented tests
    # Narrow deliberately. `labeled` fires for every label, so matching only on
    # the label being present would let any other label, added by a person or
    # by labeler.yml, start a second run that cancels the one already booting
    # an emulator.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled'
          && github.event.label.name == 'android-instrumented-tests')
      || (github.event.action != 'labeled'
          && contains(github.event.pull_request.labels.*.name, 'android-instrumented-tests'))
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests run against the app, which applies the Google Services
      # plugin and signs its debug type, so this needs the configuration and
      # the key rather than compiling bare. It restores without saving: it
      # never runs on main, and its key carries the host triple, so no other
      # job would read the entry.
      - name: Set up the Android build
        uses: ./.github/actions/setup-android-build
        with:
          require_inputs: "true"
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          keystore_base64: ${{ secrets.CI_GITHUB_KEYSTORE_KEY_FILE }}
          keystore_pass: ${{ secrets.CI_KEYSTORE_PASS }}
          keystore_alias: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          keystore_key_pass: ${{ secrets.CI_KEYSTORE_KEY_PASS }}

      # The same values the distribution builds use, because the tests run
      # against the real configuration rather than a placeholder one: the
      # application id has to match the Google configuration decoded above,
      # and the signing config reads the keystore's credentials.
      #
      # Hardware acceleration needs the emulator's architecture to match the
      # runner's, which is why this is arm64 rather than the x86 image the
      # Linux runners would want.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
          FIAT_SYMBOL: ${{ vars.FIAT_SYMBOL || '$' }}
          LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        with:
          api-level: 30
          arch: arm64-v8a
          target: google_apis
          profile: pixel_5
          disable-animations: true
          working-directory: hosts/android
          # Flavours are declared only in the app module, so this resolves
          # there and runs that module's tests. The instrumented tests in the
          # library modules are not covered, as upstream did not cover them.
          script: ./gradlew connectedGpDebugAndroidTest --no-daemon

      # The report says which test failed; the job status only says one did.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-report
          path: hosts/android/app/build/reports/androidTests/
          retention-days: 5
          if-no-files-found: ignore
