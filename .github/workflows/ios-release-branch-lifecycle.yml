name: Release Branch Lifecycle

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Deliberately every `release/` branch, app and package alike. The repository
  # deletes merged branches itself, and this is the only thing that cleans up one
  # whose PR was closed without merging. A leftover branch is not just untidy:
  # release-ios.yml and ios-prepare-pipeline.yml both fail outright when the branch
  # they are about to create already exists, so leaving it turns re-cutting the same
  # version into a failure rather than a retry.
  cleanup_release_branch:
    name: Delete release branch on PR close without merge
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release/') && github.event.pull_request.merged == false
    steps:
      - name: Delete release branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            console.log(`Deleting release branch: ${branch}`);
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              console.log(`Deleted branch ${branch}`);
            } catch (deleteError) {
              if (deleteError.status === 422) {
                console.log(`Branch ${branch} already deleted`);
              } else {
                console.log(`Warning: failed to delete branch ${branch}: ${deleteError.message}`);
              }
            }

  # Only an app release carries a source branch to go back to. The script already
  # requires the source_ref metadata, so this narrows the same rule to the branch
  # name and keeps a package release PR from reaching the job at all.
  create_backport_pr:
    name: Create backport PR to source branch
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release/release-') && github.event.pull_request.merged == true
    steps:
      - name: Extract source_ref from PR body and create backport PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const releaseBranch = context.payload.pull_request.head.ref;
            const mergedPrBody = context.payload.pull_request.body || '';

            console.log(`Processing backport for merged PR #${prNumber}`);
            console.log(`Release branch: ${releaseBranch}`);

            const metadataRegex = /<!--\s*RELEASE_METADATA:\s*source_ref=(\S+)\s*-->/;
            const match = mergedPrBody.match(metadataRegex);
            if (!match) {
              console.log('No source_ref metadata found in PR body. Skipping backport.');
              return;
            }
            const sourceRef = match[1];
            console.log(`Found source_ref: ${sourceRef}`);

            const baseRef = context.payload.pull_request.base.ref;
            if (sourceRef === baseRef) {
              console.log(`source_ref equals the PR base branch (${baseRef}) — nothing to backport. Skipping.`);
              return;
            }

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: sourceRef
              });
              console.log(`Source branch ${sourceRef} exists`);
            } catch (error) {
              console.log(`Source ref ${sourceRef} is not a branch or doesn't exist. Skipping backport.`);
              return;
            }

            const { data: existingPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${releaseBranch}`,
              base: sourceRef,
              state: 'open'
            });
            if (existingPrs.length > 0) {
              console.log(`Backport PR already exists: ${existingPrs[0].html_url}`);
              return;
            }

            const backportTitle = `Backport: ${context.payload.pull_request.title}`;
            const backportBody = `This PR backports changes from the release branch to the source branch.

            **Release PR:** #${prNumber}
            **Release branch:** \`${releaseBranch}\`
            **Target branch:** \`${sourceRef}\`

            ### Changes included:
            - Incremented build numbers
            - Any hotfixes made during the release process

            ---
            <!-- AUTO_BACKPORT_PR -->`;

            try {
              const { data: backportPr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: backportTitle,
                head: releaseBranch,
                base: sourceRef,
                body: backportBody
              });
              console.log(`Created backport PR: ${backportPr.html_url}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `✅ Backport PR created: #${backportPr.number}\n\nThis will merge release changes back to \`${sourceRef}\`.`
              });
            } catch (error) {
              core.setFailed(`Failed to create backport PR: ${error.message}`);
            }
