# Proves the credentials a release depends on still work, without building or
# publishing anything.
#
# Certificates, provisioning profiles and store API keys expire. Finding that
# out during a release is expensive, and a release is the worst place to learn
# it because the build has already been paid for. This runs on a schedule so
# expiry is discovered on an ordinary morning instead.
#
# Nothing here produces an artifact. Each job authenticates, reads enough to
# prove the credential is live, and removes whatever it materialised.
name: Validate signing credentials

on:
  schedule:
    # 06:00 UTC on weekdays, before anyone would start a release.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  # The Android identity exchange consumes the run's OIDC assertion.
  id-token: write

jobs:
  android:
    name: Android delivery credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The same check the nightly runs before it builds: it proves the identity
      # exchange works and that the delivery target is real, and it uploads
      # nothing. The action's own limits apply, and are stated there: listing
      # groups is available to a role that cannot write.
      - uses: ./.github/actions/check-android-delivery
        with:
          app_id: ${{ secrets.ANDROID_FIREBASE_NIGHTLY_APP_ID }}
          groups: ${{ vars.ANDROID_FIREBASE_GROUP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      # The auth action removes its own credential file in a post step. This
      # fails the job if it is still there, rather than trusting that.
      - name: Confirm no credential file survives
        if: always()
        run: |
          set -euo pipefail
          found="$(find "${GITHUB_WORKSPACE}" -maxdepth 2 -name 'gha-creds-*.json' 2>/dev/null || true)"
          if [ -n "${found}" ]; then
            echo "::error::A federated credential file was left behind"
            printf '%s\n' "${found}"
            exit 1
          fi

  ios:
    name: iOS signing credentials
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A scheduled run is started by nobody, so there is no one to check.
      # Narrower than write access: see the action for why, and
      # IOS_SIGNING_ACTORS for who.
      - name: Require an iOS signing actor
        if: github.event_name != 'schedule'
        uses: ./.github/actions/require-ios-signing-actor
        with:
          allowed: ${{ vars.IOS_SIGNING_ACTORS }}
          actor: ${{ github.triggering_actor }}

      # match_auth_required so the repository holding the certificates is
      # reachable; that access is itself one of the things under test.
      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install
        with:
          match_repository_pat: ${{ secrets.FASTLANE_RO_PAT }}
          match_auth_required: "true"

      # Reads one page of applications. That is enough to prove the key, the
      # issuer and the key id agree and that the key has not expired, and it
      # writes nothing to App Store Connect.
      - name: Check the App Store Connect key still authenticates
        working-directory: hosts/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          bundle exec ruby -e '
            require "spaceship"
            require "base64"
            key = Base64.decode64(ENV.fetch("ASC_KEY_BASE64"))
            Spaceship::ConnectAPI.auth(
              key_id: ENV.fetch("ASC_KEY_ID"),
              issuer_id: ENV.fetch("ASC_ISSUER_ID"),
              key: key
            )
            apps = Spaceship::ConnectAPI::App.all
            abort("the key authenticated but no application is visible to it") if apps.empty?
            puts "App Store Connect key is live; #{apps.length} application(s) visible"
          '

      # Fetches the certificates and profiles a release would sign with, read
      # only, so nothing is created or renewed. This is what notices an expiry
      # before a release does.
      - name: Check the signing certificates and profiles are fetchable
        working-directory: hosts/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.FASTLANE_RO_PAT }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bundle exec fastlane match appstore --readonly --verbose

      # A keychain and decrypted certificates outlive the steps that made them.
      # The runner is ephemeral, but a job that leaves them behind is a job
      # whose next change might not be on an ephemeral runner.
      - name: Remove what this job materialised
        if: always()
        run: |
          set -euo pipefail
          security delete-keychain github_actions_keychain 2>/dev/null || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles 2>/dev/null || true
          rm -rf ~/.fastlane 2>/dev/null || true
          echo "keychain and fetched profiles removed"
