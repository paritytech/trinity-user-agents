name: Registry drift

# Manifests can advance even when publishing fails. Tags and GitHub Releases
# already wait for npm confirmation; this check covers the default branch.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Manifests versus registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The iOS package falls back to a published xcframework when no local one
      # is staged. Bindings are generated per commit and UniFFI checks the
      # pairing at initialization, so a fallback naming an older release means
      # anything resolving this package fails to initialize. Every CI job sets
      # TRUAPI_USE_LOCAL_BINARY=1, so nothing else looks at it.
      - name: Compare the iOS published fallback against its newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          declared_url="$(sed -n -E 's/^let publishedBinaryURL = "(.*)"$/\1/p' Package.swift)"
          declared="$(printf '%s' "${declared_url}" \
            | sed -n -E 's|.*%40parity%2Fios-host%40([^/]+)/.*|\1|p')"
          if [ -z "${declared}" ]; then
            echo "::error::Cannot read an @parity/ios-host version from publishedBinaryURL."
            exit 1
          fi

          # Pre-releases are cut by hand for app-side testing and are not what
          # the default branch should fall back to.
          # Paginated: a fixed limit silently reports no drift once that many
          # other releases postdate the newest iOS one.
          newest="$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name' \
            | sed -n 's|^@parity/ios-host@||p' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -1)"

          if [ -n "${newest}" ] && [ "${declared}" != "${newest}" ]; then
            echo "@parity/ios-host@${newest} is published but Package.swift falls back to ${declared}."
            printf '%s\n' "@parity/ios-host@${newest} (Package.swift falls back to ${declared})" \
              > "${RUNNER_TEMP}/ios-drift.txt"
          else
            echo "Package.swift falls back to @parity/ios-host@${declared}."
          fi

      - name: Compare every published manifest against npm
        id: compare
        run: |
          set -euo pipefail

          exceptions="$(cat .github/registry-drift-exceptions.json)"
          jq -e 'type == "object" and all(.[]; type == "string" and test("\\S"))' <<<"$exceptions" >/dev/null

          missing=()
          for manifest in js/packages/*/package.json; do
            if [ "$(jq -r '.private // false' "${manifest}")" = "true" ]; then
              continue
            fi
            name="$(jq -er '.name | select(type == "string" and length > 0)' "$manifest")"
            version="$(jq -er '.version | select(type == "string" and length > 0)' "$manifest")"
            reason="$(jq -r --arg target "${name}@${version}" '.[$target] // empty' <<<"$exceptions")"
            if [ -n "$reason" ]; then
              echo "${name}@${version} is intentionally unpublished: ${reason}"
              continue
            fi

            if result="$(npm view "${name}@${version}" version --json --fetch-retries=2 --fetch-timeout=10000 2>"${RUNNER_TEMP}/npm-view-error.log")"; then
              echo "${name}@${version} is on npm."
            elif [ "$(jq -r '.error.code // empty' <<<"$result" 2>/dev/null)" = E404 ]; then
              echo "${name}@${version} is NOT on npm."
              missing+=("${name}@${version}")
            else
              cat "${RUNNER_TEMP}/npm-view-error.log" >&2
              echo "$result" >&2
              echo "::error::Could not query npm for ${name}@${version}; no drift issue will be changed."
              exit 1
            fi
          done

          # Written by the step above when the iOS fallback has drifted, so
          # both kinds of drift arrive in one report instead of two.
          if [ -s "${RUNNER_TEMP}/ios-drift.txt" ]; then
            while IFS= read -r entry; do
              missing+=("${entry}")
            done < "${RUNNER_TEMP}/ios-drift.txt"
          fi

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "drift=true"
            echo "report<<EOF"
            printf '%s\n' "${missing[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report the drift
        if: steps.compare.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.compare.outputs.report }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/registry-drift.yml
          TITLE: "Release drift: published versions do not match the default branch"
        run: |
          set -euo pipefail

          # Paginate the issue listing without interpreting the title as search
          # syntax. Keep one report and avoid daily duplicate comments.
          issues="$(gh api --paginate "repos/${GH_REPO}/issues?state=open&per_page=100")"
          existing="$(jq -sr --arg title "$TITLE" 'add | map(select(.pull_request == null and .title == $title)) | .[0].number // empty' <<<"$issues")"

          body_file="${RUNNER_TEMP}/registry-drift.md"
          # The format string is deliberately single quoted: the backticks are
          # markdown and the values arrive as printf arguments, not expansions.
          # shellcheck disable=SC2016
          printf 'The default branch declares versions that do not match what is published.\n\n```\n%s\n```\n\nCheck the most recent `Release` run for a failed publish or an omitted target. Document deliberately unpublished versions in `.github/registry-drift-exceptions.json` with a reason.\n\n[Registry drift runs](%s)\n' "$REPORT" "$WORKFLOW_URL" > "$body_file"

          if [ -n "${existing}" ]; then
            current_body="$(jq -sr --argjson number "$existing" 'add | .[] | select(.number == $number) | .body' <<<"$issues")"
            if [ "$current_body" != "$(cat "$body_file")" ]; then
              gh issue edit "$existing" --body-file "$body_file"
            fi
          else
            gh issue create --title "${TITLE}" --body-file "$body_file"
          fi

          echo "::error::Published versions do not match the default branch."
          exit 1
