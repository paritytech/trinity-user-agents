name: host-playground e2e

# Runs the public host-playground product inside the iOS and Android host apps
# built from this commit, and reports how each of its tests ended. The runners,
# the test list and the page runner live in e2e/host-playground/.
#
# Each platform signs in as its own registered Paseo test account. The app is
# seeded from that account's mnemonic by hooks that exist only in these builds:
# on Android a library added by a Gradle init script, on iOS a driver copied
# into the app's sources only for the simulator build this workflow makes.
# Nothing here reaches a build that testers or the public can download, and the
# mnemonic only ever travels as a file.

# Runs once a day on main, two hours before the iOS nightly starts at 20:00 UTC
# so the result is in before either nightly ships. A pull request runs it on
# demand with the `host-playground-e2e` label, and again on each push while the
# label stays on.
on:
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android emulator
    # Narrow on purpose: `labeled` fires for every label, so only this label
    # being added, or a push while it is on, starts a pull request run. A fork
    # gets none of the secrets the build and the account need.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && ((github.event.action == 'labeled' && github.event.label.name == 'host-playground-e2e')
              || (github.event.action == 'synchronize'
                  && contains(github.event.pull_request.labels.*.name, 'host-playground-e2e'))))
    # On the job, so a run started by another label never cancels one in
    # progress: a skipped job never joins the group.
    concurrency:
      group: host-playground-e2e-android-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: ${{ github.workspace }}/target/e2e-host-playground/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up the Android build
        uses: ./.github/actions/setup-android-build
        with:
          require_inputs: "true"
          google_services_json_base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          keystore_base64: ${{ secrets.CI_GITHUB_KEYSTORE_KEY_FILE }}
          keystore_pass: ${{ secrets.CI_KEYSTORE_PASS }}
          keystore_alias: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          keystore_key_pass: ${{ secrets.CI_KEYSTORE_KEY_PASS }}

      # The nightly build type, which runs on Paseo where the account and
      # host-playground.paseo live, with the e2e hooks added. Only this job
      # applies the init script.
      - name: Build the nightly APK with the e2e hooks
        working-directory: hosts/android
        env:
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'io.parity.polkadotapp' }}
          APPLICATION_NAME: ${{ vars.APPLICATION_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
          FIAT_SYMBOL: ${{ vars.FIAT_SYMBOL || '$' }}
          LOG_COLLECTION_EMAIL: ${{ vars.LOG_COLLECTION_EMAIL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          TERMS_OF_USE_URL: ${{ vars.TERMS_OF_USE_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          GOOGLE_OAUTH_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          NIGHTLY_FUNDING_MNEMONIC: ${{ secrets.NIGHTLY_FUNDING_MNEMONIC }}
          CI_KEYSTORE_PASS: ${{ secrets.CI_KEYSTORE_PASS }}
          CI_KEYSTORE_KEY_ALIAS: ${{ secrets.CI_KEYSTORE_KEY_ALIAS }}
          CI_KEYSTORE_KEY_PASS: ${{ secrets.CI_KEYSTORE_KEY_PASS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            --init-script "${GITHUB_WORKSPACE}/e2e/host-playground/android/e2e.init.gradle.kts" \
            assembleGpNightly
          shopt -s nullglob
          found=(app/build/outputs/apk/gp/nightly/*.apk)
          if [ ${#found[@]} -ne 1 ]; then
            echo "::error::Expected one APK, found ${#found[@]}"
            exit 1
          fi
          mv "${found[0]}" "${RUNNER_TEMP}/app-e2e.apk"
          rm -f develop_key.jks app/google-services.json

      # The mnemonic is written to a file only this user can read, and the
      # runner hands it to the app through run-as, never on a command line.
      - name: Write the test account's mnemonic
        env:
          MNEMONIC: ${{ secrets.E2E_ANDROID_MNEMONIC }}
        run: |
          set -euo pipefail
          if [ -z "${MNEMONIC}" ]; then
            echo "::error::E2E_ANDROID_MNEMONIC is not set"
            exit 1
          fi
          umask 077
          printf '%s' "${MNEMONIC}" > "${RUNNER_TEMP}/android.mnemonic"

      # Hardware acceleration for the emulator on a Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google APIs image, so Firebase Remote Config, where the app reads its
      # chain list, works. x86_64 matches the runner and the APK's slices.
      - name: Run host-playground on the emulator
        env:
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node e2e/host-playground/android/run.mjs --apk "${RUNNER_TEMP}/app-e2e.apk" --mnemonic-file "${RUNNER_TEMP}/android.mnemonic" --out "${OUT}"

      - name: Summary
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/android.mnemonic"
          if [ -f "${OUT}/report.md" ]; then
            cat "${OUT}/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the run did not reach the tests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-playground-e2e-android
          path: ${{ env.OUT }}
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS simulator
    # Narrow on purpose: `labeled` fires for every label, so only this label
    # being added, or a push while it is on, starts a pull request run. A fork
    # gets none of the secrets the build and the account need.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && ((github.event.action == 'labeled' && github.event.label.name == 'host-playground-e2e')
              || (github.event.action == 'synchronize'
                  && contains(github.event.pull_request.labels.*.name, 'host-playground-e2e'))))
    # On the job, so a run started by another label never cancels one in
    # progress: a skipped job never joins the group.
    concurrency:
      group: host-playground-e2e-ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 150
    env:
      IOS_BUNDLE_ID: "io.parity.polkadotapp"
      RUN_IN_CI: "true"
      OUT: ${{ github.workspace }}/target/e2e-host-playground/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup iOS Environment
        uses: ./hosts/ios/.github/actions/install

      - name: Bootstrap the in-tree core
        uses: ./.github/actions/bootstrap-ios-core

      - name: Configure Google services
        uses: ./hosts/ios/.github/actions/configure-google-services
        with:
          google_service_info_base64: ${{ secrets.GOOGLE_SERVICE_INFO_RELEASE_BASE64 }}
          expected_bundle_id: ${{ env.IOS_BUNDLE_ID }}

      - name: Configure secrets
        uses: ./hosts/ios/.github/actions/configure-secrets
        with:
          sentry_dsn: ${{ secrets.SENTRY_DSN }}
          meld_basic_auth_token: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}

      # The simulator lane's build with the driver copied into the app's
      # sources for this build only.
      - name: Build the E2E simulator app
        run: e2e/host-playground/ios/build.sh

      # Grants the notification and camera permissions simctl cannot. The tap is
      # third party, so it is pinned to a reviewed commit and Homebrew is kept
      # from updating it.
      - name: Install applesimutils
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          WIX_TAP_COMMIT: 8f636f84541e08e850f455d7cffdfbd7ba305d3f
        run: |
          set -euo pipefail
          brew tap wix/brew
          git -C "$(brew --repo wix/brew)" checkout --quiet "${WIX_TAP_COMMIT}"
          brew trust wix/brew
          brew install wix/brew/applesimutils
          applesimutils --version

      - name: Write the test account's mnemonic
        env:
          MNEMONIC: ${{ secrets.E2E_IOS_MNEMONIC }}
        run: |
          set -euo pipefail
          if [ -z "${MNEMONIC}" ]; then
            echo "::error::E2E_IOS_MNEMONIC is not set"
            exit 1
          fi
          umask 077
          printf '%s' "${MNEMONIC}" > "${RUNNER_TEMP}/ios.mnemonic"

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          for runtime in sorted(d, reverse=True):
              for dev in d[runtime]:
                  if "iOS" in runtime and dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()')"
          if [ -z "${udid}" ]; then
            echo "::error::No available iPhone simulator"
            exit 1
          fi
          xcrun simctl boot "${udid}" || true
          xcrun simctl bootstatus "${udid}" -b
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Run host-playground in the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(hosts/ios/build_simulator/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::Expected one .app under build_simulator, found ${#apps[@]}"
            exit 1
          fi
          node e2e/host-playground/ios/run.mjs --app "${apps[0]}" \
            --mnemonic-file "${RUNNER_TEMP}/ios.mnemonic" --out "${OUT}" --device "${UDID}" \
            --timeout-minutes 90

      - name: Summary
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/ios.mnemonic"
          if [ -f "${OUT}/report.md" ]; then
            cat "${OUT}/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the run did not reach the tests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-playground-e2e-ios
          path: ${{ env.OUT }}
          retention-days: 7
          if-no-files-found: ignore
