name: Release

# workflow_run is the intended gate for "release only after green CI". It is
# safe here: it fires only for CI runs on main or release branches (post-merge,
# trusted code), is
# guarded by conclusion == success and a release: commit subject, and checks
# out the pinned head_sha with persist-credentials: false. No untrusted PR code
# ever runs in this privileged context.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, release/v0.3.2]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only run on green CI and only for commits whose subject starts with
    # "release:" — guards against accidental version bumps in unrelated PRs.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      ios_version: ${{ steps.version.outputs.ios_version }}
      android_version: ${{ steps.version.outputs.android_version }}
      cli_version: ${{ steps.version.outputs.cli_version }}
      published: ${{ steps.confirm.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve target packages
        id: version
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${RELEASE_COMMIT_MESSAGE%%$'\n'*}"
          # Squash merges append " (#<pr>)" to the pull request title.
          subject="${subject% (#*)}"
          release="${subject#release: }"
          packages=""
          ios_version=""
          android_version=""
          cli_version=""
          seen_names="|"

          IFS=',' read -ra targets <<< "${release}"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::Release subject does not declare a package and version: ${subject}"
            exit 1
          fi
          for target in "${targets[@]}"; do
            # Trim whitespace around comma-separated targets.
            target="${target#"${target%%[![:space:]]*}"}"
            target="${target%"${target##*[![:space:]]}"}"
            if [[ ! "${target}" =~ ^(@parity/truapi|@parity/truapi-host|@parity/truapi-provider|@parity/truapi-debugger|@parity/ios-host|@parity/android-host)[[:space:]]+([^[:space:]]+)$ ]]; then
              echo "::error::Unsupported release target '${target}' in subject: ${subject}"
              exit 1
            fi
            name="${BASH_REMATCH[1]}"
            declared_version="${BASH_REMATCH[2]}"

            if [[ "${seen_names}" == *"|${name}|"* ]]; then
              echo "::error::Release subject lists ${name} more than once."
              exit 1
            fi
            seen_names+="${name}|"

            case "${name}" in
              # The truapi-host CLI crate tracks the protocol version, so a
              # protocol release also publishes its prebuilt binaries.
              @parity/truapi)
                path="js/packages/truapi"
                cli_version="${declared_version}"
                ;;
              @parity/truapi-host) path="js/packages/truapi-host" ;;
              @parity/truapi-provider) path="js/packages/truapi-provider" ;;
              @parity/truapi-debugger) path="js/packages/truapi-debugger" ;;
              @parity/ios-host)
                if [[ ! "${declared_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
                  echo "::error::Invalid iOS host version '${declared_version}'."
                  exit 1
                fi
                ios_version="${declared_version}"
                continue
                ;;
              @parity/android-host)
                if [[ ! "${declared_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
                  echo "::error::Invalid Android host version '${declared_version}'."
                  exit 1
                fi
                android_version="${declared_version}"
                continue
                ;;
            esac

            version="$(jq -r '.version' "${path}/package.json")"
            if [ "${declared_version}" != "${version}" ]; then
              echo "::error::Release subject declares ${name} ${declared_version}, but ${path}/package.json is ${version}."
              exit 1
            fi

            tag="${name}@${version}"
            if npm_status="$(npm view "${tag}" version --registry=https://registry.npmjs.org 2>&1)"; then
              echo "Package ${tag} already exists on npm; skipping."
            elif grep -Eq 'E404|404 Not Found' <<< "${npm_status}"; then
              echo "Publishing ${tag}."
              packages+="${name}|${path}|${version}|${tag}"$'\n'
            else
              echo "${npm_status}" >&2
              exit 1
            fi
          done

          # Every `@parity/*` range a publishing package depends on must be
          # satisfiable from the registry - already published, or named in THIS
          # release subject. Without this a package publishes green and is
          # uninstallable: `@parity/truapi-debugger` needs `@parity/truapi
          # ^0.10.0`, so releasing it before truapi 0.10.0 reaches npm gives every
          # consumer `ETARGET, no matching version`. The version check above cannot
          # see this - it compares the subject against the working tree.
          while IFS='|' read -r dep_name dep_path _dep_version _dep_tag; do
            [ -n "${dep_path}" ] || continue
            # Extract BEFORE the loop so a jq failure trips errexit here. Inside a
            # process substitution it would be invisible: zero iterations, exit 0.
            dep_lines="$(jq -r '(.dependencies // {}) | to_entries[] | select(.key | startswith("@parity/")) | "\(.key)|\(.value)"' "${dep_path}/package.json" </dev/null)"
            while IFS='|' read -r range_pkg range; do
              [ -n "${range_pkg}" ] || continue
              # Named in this subject? Then it must actually SATISFY the range.
              # `|| true` is required: under `set -euo pipefail` a non-matching grep
              # exits 1, pipefail promotes it, and errexit would kill the step here -
              # on the ORDINARY path, where the dep is already on npm and simply not
              # named in this subject.
              shipped="$(grep -F "${range_pkg}|" <<< "${packages}" | head -n1 | cut -d'|' -f3 || true)"
              if [ -n "${shipped}" ]; then
                # Exact-match on purpose, and no semver library: every internal
                # `@parity/*` range in this repo is kept at exactly `^<version>` by
                # scripts/sync-release-versions.mjs, so that is the only shape that
                # can legitimately appear. Matching the name alone would accept a
                # subject shipping truapi 0.9.0 beside a debugger needing ^0.10.0,
                # publishing the ETARGET this guard exists to stop.
                if [ "${range}" = "^${shipped}" ] || [ "${range}" = "${shipped}" ]; then
                  echo "${dep_name}: ${range_pkg}@${range} is satisfied by ${shipped} in this release."
                  continue
                fi
                # Deliberately strict: a range like `*` or `>=0.10.0` that ${shipped}
                # does satisfy is still refused, because this repo keeps every
                # internal range at exactly `^<version>` and a looser one means the
                # sync script was bypassed. Say that, rather than implying the range
                # is incompatible.
                echo "::error::${dep_name} depends on ${range_pkg}@${range}, which is not the exact \`^${shipped}\` this release publishes. Internal ranges are pinned by scripts/sync-release-versions.mjs; run it (or make the range exact) rather than loosening this check."
                exit 1
              fi
              # Capture stderr and require a genuine 404, matching the tag check
              # above: a transient registry failure must not read as "unpublished".
              # `< /dev/null` is not decoration: this loop is fed by the process
              # substitution below, and any command in the body that reads stdin
              # swallows the remaining lines - silently skipping every dep after the
              # first. Real `npm view` does not read stdin, so this is latent today.
              if view_out="$(npm view "${range_pkg}@${range}" version \
                  --registry=https://registry.npmjs.org </dev/null 2>&1)"; then
                : # satisfiable from the registry
              elif grep -Eq 'E404|404 Not Found|No matching version' <<< "${view_out}"; then
                echo "::error::${dep_name} depends on ${range_pkg}@${range}, which is neither on npm nor in this release subject; publishing it would be uninstallable."
                exit 1
              else
                echo "${view_out}" >&2
                echo "::error::could not check ${range_pkg}@${range} against the registry."
                exit 1
              fi
            # Read the deps into a variable FIRST. A `jq` failure inside a process
            # substitution is invisible to `set -euo pipefail`: the loop simply runs
            # zero times and the guard passes, so an unreadable manifest would read
            # as "no internal deps to check".
            done < <(printf '%s\n' "${dep_lines}")
          done <<< "${packages}"

          echo "ios_version=${ios_version}" >> "$GITHUB_OUTPUT"
          echo "android_version=${android_version}" >> "$GITHUB_OUTPUT"
          echo "cli_version=${cli_version}" >> "$GITHUB_OUTPUT"

          if [ -z "${packages}" ]; then
            echo "No requested npm packages need publishing."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            {
              echo "packages<<EOF"
              printf '%s' "${packages}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release manifests
        if: steps.version.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          npm run check-release-versions
          remaining_changesets="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print)"
          if [ -n "${remaining_changesets}" ]; then
            echo "::error::Release commit still contains unconsumed changesets. Open a new release PR from the default branch, then run \`npm run version-packages\` and \`scripts/cut-version.sh\`. Do not reset the merged default branch or rerun versioning on top of an unmerged release bump."
            echo "${remaining_changesets}"
            exit 1
          fi

      - if: steps.version.outputs.proceed == 'true'
        uses: ./.github/actions/rust-nightly
        with:
          components: rustfmt

      - if: steps.version.outputs.proceed == 'true'
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # stable
        with:
          toolchain: stable

      - if: steps.version.outputs.proceed == 'true'
        uses: ./.github/actions/rust-cache
        with:
          save: "false"

      - name: Install dependencies
        if: steps.version.outputs.proceed == 'true'
        run: npm ci

      - name: Install wasm-pack
        if: steps.version.outputs.proceed == 'true' && (contains(steps.version.outputs.packages, '@parity/truapi-host|') || contains(steps.version.outputs.packages, '@parity/truapi-provider|'))
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build packages
        if: steps.version.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          ./scripts/codegen.sh
          if grep -q '^@parity/truapi-host|' <<< "${STEPS_VERSION_OUTPUTS_PACKAGES}"; then
            npm run build --prefix js/packages/truapi-host
            npm run build:wasm --prefix js/packages/truapi-host
          fi
          # The debugger ships `files: ["dist"]`, and `dist/` is gitignored: without
          # this the pack step would upload a tarball with no code in it and the
          # publish would still report success.
          if grep -q '^@parity/truapi-debugger|' <<< "${STEPS_VERSION_OUTPUTS_PACKAGES}"; then
            npm run build --prefix js/packages/truapi-debugger
          fi
          # Same reason as the debugger above: the provider ships `files: ["dist"]`
          # and `dist/` is the gitignored wasm-pack output.
          if grep -q '^@parity/truapi-provider|' <<< "${STEPS_VERSION_OUTPUTS_PACKAGES}"; then
            npm run build --prefix js/packages/truapi-provider
          fi
        env:
          STEPS_VERSION_OUTPUTS_PACKAGES: ${{ steps.version.outputs.packages }}

      - name: Pack package
        if: steps.version.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while IFS='|' read -r _name path _version _tag; do
            (cd "${path}" && npm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/")
          done <<< "${STEPS_VERSION_OUTPUTS_PACKAGES}"
        env:
          STEPS_VERSION_OUTPUTS_PACKAGES: ${{ steps.version.outputs.packages }}

      - name: Upload package artifacts
        if: steps.version.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: artifacts/*.tgz

      - name: Attest package artifacts
        if: steps.version.outputs.proceed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.tgz

      - name: Publish via npm_publish_automation
        if: steps.version.outputs.proceed == 'true'
        uses: octokit/request-action@b91aabaa861c777dcdb14e2387e30eddf04619ae # v3.0.0
        with:
          route: POST /repos/paritytech/npm_publish_automation/actions/workflows/publish.yml/dispatches
          ref: main
          inputs: '${{ format(''{{ "repo": "{0}", "run_id": "{1}" }}'', github.repository, github.run_id) }}'
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_PUBLISH_AUTOMATION_TOKEN }}

      # The dispatch only reports acceptance, so the registry is the only proof
      # a version landed. continue-on-error still tags the confirmed subset: a
      # later run drops anything already on npm, so it must be tagged here.
      - name: Confirm packages reached npm
        id: confirm
        if: steps.version.outputs.proceed == 'true'
        continue-on-error: true
        # Above the script's own budget, so its deadline decides the outcome.
        # If this fires first, the confirmed subset is never written.
        timeout-minutes: 15
        env:
          STEPS_VERSION_OUTPUTS_PACKAGES: ${{ steps.version.outputs.packages }}
        run: printf '%s' "${STEPS_VERSION_OUTPUTS_PACKAGES}" | node scripts/wait-for-npm-publish.mjs

      # Skip rather than loop over an empty list, which yields an empty tag.
      - name: Create release tags
        if: steps.version.outputs.proceed == 'true' && steps.confirm.outputs.published != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          STEPS_CONFIRM_OUTPUTS_PUBLISHED: ${{ steps.confirm.outputs.published }}
        run: |
          set -euo pipefail
          while IFS='|' read -r _name _path _version tag; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; skipping create."
              continue
            fi
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${RELEASE_SHA}"
          done <<< "${STEPS_CONFIRM_OUTPUTS_PUBLISHED}"

      - name: Create GitHub Release
        if: steps.version.outputs.proceed == 'true' && steps.confirm.outputs.published != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_CONFIRM_OUTPUTS_PUBLISHED: ${{ steps.confirm.outputs.published }}
        run: |
          set -euo pipefail
          while IFS='|' read -r name _path version tag; do
            tarball_name="${name#@}"
            tarball_name="${tarball_name//\//-}-${version}.tgz"
            if gh release view "${tag}" >/dev/null 2>&1; then
              gh release upload "${tag}" "artifacts/${tarball_name}" --clobber
            else
              gh release create "${tag}" \
                --title "${name} ${version}" \
                --generate-notes \
                "artifacts/${tarball_name}"
            fi
          done <<< "${STEPS_CONFIRM_OUTPUTS_PUBLISHED}"

      - name: Fail if any package did not reach npm
        if: steps.confirm.outcome == 'failure'
        run: exit 1

  # Downstream hosts learn about a release from an issue on their own
  # repository. Announcing only the confirmed subset keeps a consumer from
  # being pointed at a version npm never accepted.
  notify-consumers:
    name: Notify consumer repositories
    needs: release
    if: needs.release.outputs.published != ''
    permissions:
      contents: read
    uses: ./.github/workflows/notify-consumers.yml
    with:
      published: ${{ needs.release.outputs.published }}
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets:
      CONSUMER_APP_ID: ${{ secrets.CONSUMER_APP_ID }}
      CONSUMER_APP_KEY: ${{ secrets.CONSUMER_APP_KEY }}

  publish-android:
    name: Publish Android host
    needs: release
    if: needs.release.outputs.android_version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.release.outputs.android_version }}
      ref: ${{ github.event.workflow_run.head_sha }}

  publish-cli:
    name: Publish truapi-host binaries
    needs: release
    if: needs.release.outputs.cli_version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.release.outputs.cli_version }}
      ref: ${{ github.event.workflow_run.head_sha }}

  publish-ios:
    name: Publish iOS host
    needs: release
    if: needs.release.outputs.ios_version != ''
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ needs.release.outputs.ios_version }}
      ref: ${{ github.event.workflow_run.head_sha }}
      manifest_branch: ${{ github.event.workflow_run.head_branch }}
