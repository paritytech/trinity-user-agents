name: iOS Nightly
# The ref a run built, so the changed check below can tell a night that built
# main apart from one that built another ref.
run-name: iOS Nightly (${{ inputs.source_ref || 'main' }})

# A night is one run, and cancelling one mid-upload would leave a build number
# taken and nothing announced, so a second start waits for the first.
concurrency:
  group: ios-nightly
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to create release branch from (existing branch name or commit SHA)"
        type: string
        required: false
        default: main
      increment_step:
        description: "Build number increment step (1 if empty)"
        type: string
        required: false
        default: ""
  schedule:
    # 20:00 UTC every day, four hours after the app repository builds
    # Safetynet. Far enough apart that one finishes before the other starts,
    # and late enough to carry the day's merges. Weekends included, since main
    # takes merges then too; a night with nothing new is skipped below.
    - cron: "0 20 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
  statuses: write

jobs:
  # A build straight from main releases unconditionally, so a night on which
  # nothing merged would still take a build number, upload to TestFlight and
  # announce an empty changelog. The schedule only builds when main has moved
  # past what the last successful nightly built; a dispatch always builds.
  changed:
    name: Changed since the last nightly
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        uses: ./.github/actions/changed-since-last-build
        with:
          github_token: ${{ github.token }}
          workflow: ios-nightly-prepare.yml
          title: iOS Nightly (main)

  prepare:
    needs: changed
    # !cancelled() so a failed check builds rather than skips, and != 'false'
    # so an empty output does the same.
    if: >-
      !cancelled()
      && (github.event_name != 'schedule' || needs.changed.outputs.changed != 'false')
    uses: ./.github/workflows/ios-prepare-pipeline.yml
    with:
      is_nightly: true
      bump_level: "no-bump"
      source_ref: ${{ inputs.source_ref || 'main' }}
      increment_step: ${{ inputs.increment_step || '' }}

  # The night itself, in this run, so a failed leg is re-run in place.
  nightly:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.should_release == 'true' }}
    uses: ./.github/workflows/ios-nightly.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      statuses: write
    with:
      release_branch: ${{ needs.prepare.outputs.release_branch }}
      release_pr_number: ${{ needs.prepare.outputs.release_pr_number }}
      increment_step: ${{ inputs.increment_step || '' }}
