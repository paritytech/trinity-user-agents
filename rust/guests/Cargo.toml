# Example product workers compiled to wasm. A separate workspace, since they
# only build for wasm32-unknown-unknown:
# cargo build --manifest-path rust/guests/Cargo.toml --target wasm32-unknown-unknown --release
[workspace]
resolver = "3"
members = ["early-stop", "hello", "preimage"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
futures = "0.3"
truapi = { package = "truapi-guest-api", path = "../crates/truapi-guest-api" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
