[package]
name = "trinity-stack"
# Follows @parity/trinity-stack's version; scripts/sync-release-versions.mjs writes it.
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Parses, verifies and signs Trinity stack descriptors; ships to JavaScript as @parity/trinity-stack"
repository = "https://github.com/paritytech/trinity-user-agents"
readme = "README.md"
keywords = ["polkadot", "trinity", "descriptor", "ed25519"]
categories = ["cryptography::cryptocurrencies", "parser-implementations"]
# The conformance vectors and their generator stay in the repository.
include = ["src/", "schema/", "tests/fixtures/", "README.md", "LICENSE"]

[lib]
# `cdylib` is the wasm-bindgen bundle @parity/trinity-stack ships.
crate-type = ["rlib", "cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[features]
js = ["dep:wasm-bindgen", "dep:js-sys", "dep:tsify"]

[dependencies]
base64.workspace = true
blake2b_simd.workspace = true
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
js-sys = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
strum.workspace = true
thiserror.workspace = true
tsify = { workspace = true, optional = true }
url.workspace = true
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
curve25519-dalek = { workspace = true, features = ["digest"] }

[lints]
workspace = true
