[package]
name = "truapi-server"
version = "0.1.0"
edition.workspace = true
description = "TrUAPI server runtime: dispatcher, frames, SCALE, streams"
license = "MIT AND AGPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
    "--strip-debug",
    "--strip-dwarf",
    "--strip-producers",
]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
debug-js-glue = false
demangle-name-section = false
dwarf-debug-info = false

[features]
default = ["wasm-signing-host"]
wasm-signing-host = []
# Test-host-only shortcuts a shipping host must not carry, such as answering
# resource allocation as granted without allocating anything.
test-host = []
debug-sink = ["dep:tokio-tungstenite", "dep:base64"]
ws-bridge = ["debug-sink", "dep:rand", "dep:libc"]

[dependencies]
truapi = { path = "../truapi" }
truapi-platform = { path = "../truapi-platform" }
truapi-macros = { path = "../truapi-macros" }
truapi-coinage = { path = "../truapi-coinage" }
truapi-chat-v2 = { path = "../truapi-chat-v2", default-features = false }
async-trait = "0.1"
derive_more = { version = "2", features = ["debug", "display", "error", "from"] }
futures = "0.3"
futures-timer = "3"
parity-scale-codec = { version = "3", features = ["derive"] }
scale-decode = { version = "0.16", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
unicode-normalization = "0.1"
url = "2"
hex = "0.4"
nanoid = "0.4"
blake2b_simd = { version = "1", default-features = false }
sp-crypto-hashing = { version = "0.1", default-features = false }
schnorrkel = { version = "0.11.5", default-features = false, features = ["alloc", "getrandom"] }
substrate-bip39 = { version = "0.6", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
getrandom = { version = "0.2", features = ["js"] }
hkdf = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
sha2 = "0.10"
merlin = "3"
parking_lot = "0.12"
frame-metadata = { version = "23", default-features = false, features = ["std", "current", "decode"] }
scale-info = { version = "2.11", default-features = false, features = ["decode"] }

tracing = "0.1"
# `registry` + `std` only: pulls the Registry + per-layer filter/reload, but
# not `env-filter` (which drags in `regex`, heavy on wasm).
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
verifiable = { git = "https://github.com/paritytech/verifiable.git", rev = "19b03deb89b8dea484b143afc8bbe048a74bc1ff" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
truapi = { path = "../truapi", features = ["uniffi"] }
truapi-platform = { path = "../truapi-platform", features = ["uniffi"] }
futures = { version = "0.3", features = ["thread-pool"] }
rand = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
# Drives the JamPeerTransport QUIC endpoint, and the debug sink's WebSocket.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }
uniffi.workspace = true
subxt = { version = "0.50.3", default-features = false, features = ["native"] }
subxt-rpcs = { version = "0.50.3", default-features = false, features = ["jsonrpsee", "native"] }
base64 = { version = "0.22", optional = true }
# JAMNP-S QUIC for the native JamPeerTransport; the browser dials WebTransport
# from its JavaScript session instead.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
x509-parser = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
js-sys = "0.3"
subxt = { version = "0.50.3", default-features = false, features = ["web"] }
subxt-rpcs = { version = "0.50.3", default-features = false, features = ["web"] }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
send_wrapper = { version = "0.6", features = ["futures"] }
web-time = "1"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
scale-info = "2.11"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
