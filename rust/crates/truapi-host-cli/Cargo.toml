[package]
name = "truapi-host-cli"
version = "0.26.0"
edition.workspace = true
description = "Headless TrUAPI hosts: a signing-host companion and a pairing host that pair over the real People-chain statement store, for end-to-end testing without an external signer service"
license = "MIT"
include = ["src/**", "js/**", "deployments/**", "README.md", "SPEC.md"]

[[bin]]
name = "truapi-host"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[features]
# A scripted funding host and the core's test hooks, for the funding battery.
test-host = ["truapi/test-host"]
[lints.clippy]
complexity = "warn"
correctness = "warn"

[dependencies]
truapi = { path = "../truapi" }
# Chain connections for the People, Bulletin and Asset Hub host traffic the preset
# serves as roles, plus `Chain/*` playground methods: RPC nodes over TLS, or the
# light client with the bundled network catalog. See src/chain.rs.
truapi-provider = { path = "../truapi-provider", default-features = false, features = ["ws", "networks"] }
trinity-stack = { path = "../trinity-stack" }
anyhow = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
async-trait = { workspace = true }
base64 = { workspace = true }
bip39 = { workspace = true, features = ["rand"] }
clap = { workspace = true, features = ["derive", "env"] }
crossterm = { workspace = true, features = ["event-stream"] }
derive_more = { workspace = true, features = ["debug", "display", "error", "from"] }
flate2 = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
fs2 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
parity-scale-codec = { workspace = true, features = ["derive"] }
qrcode = { workspace = true }
ratatui = { workspace = true, features = ["crossterm", "unstable-rendered-line-info"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rqrr = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
subxt-rpcs = { workspace = true, features = ["jsonrpsee", "native"] }
tar = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "net", "time", "signal", "process"] }
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }
unicode-width = { workspace = true }
zeroize = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
truapi = { path = "../truapi", features = ["mock"] }
