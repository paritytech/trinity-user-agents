[package]
name = "truapi-pvm-host"
version = "0.1.0"
edition.workspace = true
description = "Reviewed host-rust-core bridge to the standalone PolkaVM application runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[features]
default = []
ffi = ["pvm-runtime/ffi"]
browser-assets = ["dep:pvm-runtime-assets"]

[dependencies]
pvm-runtime = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "bf57c4f84455694514774705b2d8e15134984f10" }
pvm-runtime-assets = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "bf57c4f84455694514774705b2d8e15134984f10", optional = true }

[lints]
workspace = true

[[bin]]
name = "pvm-assets-export"
path = "src/bin/pvm-assets-export.rs"
required-features = ["browser-assets"]
