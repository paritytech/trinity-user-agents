[package]
name = "truapi-pvm-host"
version = "0.1.0"
edition.workspace = true
description = "Reviewed host-rust-core bridge to the standalone PolkaVM application runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[features]
default = []
ffi = ["pvm-runtime/ffi"]
browser-assets = ["dep:pvm-runtime-assets"]

[dependencies]
pvm-runtime = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "0ecfa3fa9d54b237c44b69829a7deb4e38ce25e0" }
pvm-runtime-assets = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "0ecfa3fa9d54b237c44b69829a7deb4e38ce25e0", optional = true }

[lints]
workspace = true

[[bin]]
name = "pvm-assets-export"
path = "src/bin/pvm-assets-export.rs"
required-features = ["browser-assets"]
