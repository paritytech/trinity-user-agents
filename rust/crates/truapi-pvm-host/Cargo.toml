[package]
name = "truapi-pvm-host"
version = "0.1.0"
edition.workspace = true
description = "Reviewed host-rust-core bridge to the standalone PolkaVM application runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[features]
default = []
ffi = ["pvm-runtime/ffi"]
browser-assets = ["dep:pvm-runtime-assets"]

[dependencies]
pvm-runtime = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "b0a522a673171ae35275b1dd8d4c3e855bfe36f2" }
pvm-runtime-assets = { git = "https://github.com/paritytech/pvm-host-runtime.git", rev = "b0a522a673171ae35275b1dd8d4c3e855bfe36f2", optional = true }

[lints]
workspace = true

[[bin]]
name = "pvm-assets-export"
path = "src/bin/pvm-assets-export.rs"
required-features = ["browser-assets"]
