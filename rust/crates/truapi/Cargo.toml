[package]
name = "truapi"
version = "0.26.0"
edition.workspace = true
license.workspace = true
description = "TrUAPI trait and type definitions, and the runtime hosts embed"

[dependencies]
async-trait = { version = "0.1", optional = true }
derive_more = { version = "2", default-features = false, features = ["display"] }
futures = { version = "0.3", optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
parity-scale-codec = { version = "3", default-features = false, features = ["derive"] }
truapi-macros = { path = "../truapi-macros" }
uniffi = { workspace = true, optional = true }

[features]
default = ["runtime"]
# Async host traits, cancellation, and subscription primitives.
runtime = [
    "dep:async-trait",
    "dep:futures",
    "parity-scale-codec/std",
]
# FFI derives on the protocol types consumed by native hosts.
uniffi = ["runtime", "dep:uniffi"]

[lints]
workspace = true
