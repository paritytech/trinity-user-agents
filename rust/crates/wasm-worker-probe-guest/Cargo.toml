[package]
name = "wasm-worker-probe-guest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Counter bot compiled to wasm32: a non-JavaScript Worker product on truapi-worker, drawing a chat message, a Pocket card, or both from one count"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The wasm32 ABI draws a Pocket card and makes no Chat call. Without it the
# module is the chat bot the CLI proof runs.
pocket = []
# The wasm32 ABI posts its chat message and draws a Pocket card, both from one
# count. Excludes `pocket`.
unified = []

[dependencies]
truapi-worker = { path = "../truapi-worker" }
parity-scale-codec = { workspace = true }

[lints]
workspace = true
