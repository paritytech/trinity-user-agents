[package]
name = "truapi-provider"
version = "0.1.0"
edition.workspace = true
description = "Network provider backends for ChainProvider: remote WebSocket JSON-RPC nodes on every target, plus an embedded smoldot light client on native targets"
license = "MIT AND Apache-2.0"

[lib]
# All three are load-bearing, one per artifact this crate ships as: `rlib` for
# the workspace, its tests and examples; `cdylib` for the wasm-bindgen bundle and
# the Android JNI library; `staticlib` for the iOS xcframework. Cargo has no way
# to select these per target, so every build emits all three. Only the linker
# step for the artifact being built actually consumes one.
crate-type = ["rlib", "cdylib", "staticlib"]

# Builds the uniffi-bindgen binary used to generate the Swift bindings.
[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

# wasm-pack's bundled wasm-opt rejects the bulk-memory ops modern rustc emits
# for wasm32; skip it. The wasm-bindgen output is already valid for browsers,
# and bundlers (e.g. Vite) optimize the asset downstream.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[features]
default = ["ws"]
ws = [
    "dep:jsonrpsee-client-transport",
    "dep:jsonrpsee-core",
    "dep:tokio",
    "dep:js-sys",
    "dep:send_wrapper",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
smoldot = [
    "dep:futures-timer",
    "dep:log",
    "dep:getrandom",
    "dep:libsecp256k1",
    "dep:js-sys",
    "dep:pin-project",
    "dep:rand",
    "dep:send_wrapper",
    "dep:smoldot",
    "dep:smoldot-light",
    "dep:thiserror",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:web-time",
    # The loopback TLS tunnel that makes `/wss` bootnodes dialable on native
    # targets; see `wss_tunnel`. Unused on wasm, where the browser does the TLS.
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]
js = ["ws", "dep:wasm-bindgen-futures", "dep:tracing-subscriber"]
networks = ["smoldot"]
# Swift/UniFFI bindings for native hosts (iOS, macOS, ...).
uniffi = ["smoldot", "networks", "dep:uniffi"]
# Builds the uniffi-bindgen binary (implies uniffi).
cli = ["uniffi", "uniffi/cli"]

[dependencies]
async-trait = { workspace = true }
derive_more = { workspace = true, features = ["display", "error"] }
futures = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "std"], optional = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# smoldot's native output goes through `log`, and this staticlib owns its own
# copy of that global, so the sink lives here (see logging_native). Only that
# module uses it, and only off wasm, so it arrives with the light client.
log = { workspace = true, features = ["std"], optional = true }
jsonrpsee-client-transport = { workspace = true, features = ["ws", "tls-rustls-platform-verifier"], optional = true }
jsonrpsee-core = { workspace = true, features = ["client"], optional = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"], optional = true }
# Portable timer: `snapshot` deadlines the same way on native and on wasm.
futures-timer = { workspace = true, optional = true }
# `ring` rather than the default `aws-lc-rs`, matching the backend the rest of
# the tree already resolves, so the wss tunnel adds no new crypto dependency.
tokio-rustls = { workspace = true, features = ["logging", "ring", "tls12"], optional = true }
webpki-roots = { workspace = true, optional = true }
# Cargo.lock also pins smoldot 2 and smoldot-light 1.3 for subxt's optional subxt-lightclient,
# which this workspace never enables, so neither of those is ever compiled.
smoldot-light = { workspace = true, features = ["std"], optional = true }
rand = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"], optional = true }
getrandom = { workspace = true, features = ["js"], optional = true }
# Not used directly: smoldot's secp256k1 multiplication tables are built on
# first use instead of compiling in 1 MiB of incompressible precomputed points.
libsecp256k1 = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
parking_lot = { workspace = true }
pin-project = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }
smoldot = { workspace = true, features = ["std"], optional = true }
smoldot-light = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "BinaryType",
    "CloseEvent",
    "console",
    "Event",
    "EventTarget",
    "MessageEvent",
    "MessageEventInit",
    "WebSocket",
], optional = true }
web-time = { workspace = true, optional = true }

[dev-dependencies]
# Derives a bundled spec's genesis hash so the catalog cannot drift off it.
blake2b_simd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jsonrpsee = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "test-util"] }
tokio-tungstenite = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[[example]]
name = "gateway"
required-features = ["ws", "networks"]

# `deny` rather than `forbid`: the `uniffi` feature scopes an `allow(unsafe_code)`
# for UniFFI's generated FFI glue (see src/lib.rs). Every other build has no unsafe.
[lints.rust]
unsafe_code = "deny"
