[package]
name = "truapi-polkavm-host"
version = "0.2.0"
edition.workspace = true
description = "Optional composition of the TrUAPI server and PolkaVM host runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
polkavm-host-runtime = { git = "https://github.com/paritytech/polkavm-host-runtime.git", rev = "c7fea7467dff302b85f34d6327d87d74e77b4189", version = "=0.3.0", features = ["ffi", "native-gpu"] }
truapi-server = { path = "../truapi-server" }

[lints]
workspace = true
