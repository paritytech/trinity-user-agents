[package]
name = "truapi-polkavm-host"
version = "0.2.0"
edition.workspace = true
description = "Optional composition of the TrUAPI server and PolkaVM host runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
polkavm-host-runtime = { git = "https://github.com/paritytech/polkavm-host-runtime.git", rev = "552017692a50d74ef94792b460e614f71bceb1b5", version = "=0.2.0", features = ["ffi", "native-gpu"] }
truapi-server = { path = "../truapi-server" }

[lints]
workspace = true
