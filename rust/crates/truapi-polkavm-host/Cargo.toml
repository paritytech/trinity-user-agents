[package]
name = "truapi-polkavm-host"
version = "0.2.0"
edition.workspace = true
description = "Optional composition of the TrUAPI server and PolkaVM host runtime"
license = "MIT"
repository = "https://github.com/paritytech/host-rust-core"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
polkavm-host-runtime = { git = "https://github.com/paritytech/polkavm-host-runtime.git", rev = "2f1936fa99df46f0d6686155b32d207bf1515849", version = "=0.3.0", features = ["ffi", "native-gpu"] }
truapi-server = { path = "../truapi-server" }

[lints]
workspace = true
