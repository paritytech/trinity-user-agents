name: NetworkPermissionTests
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
packages:
  TrUAPIHost:
    path: ../../..
targets:
  NetworkTestHost:
    type: application
    platform: iOS
    sources: [App.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.parity.truapi.network-test-host
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: Network permission tests use a stubbed camera.
        NSMicrophoneUsageDescription: Network permission tests use a stubbed microphone.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  NetworkPermissionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.parity.truapi.network-permission-tests
    dependencies:
      - target: NetworkTestHost
      - package: TrUAPIHost
schemes:
  NetworkPermissionTests:
    build:
      targets:
        NetworkTestHost: all
        NetworkPermissionTests: [test]
    test:
      targets: [NetworkPermissionTests]
