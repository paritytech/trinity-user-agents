[package]
name = "qjs-guest"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["array-buffer"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
bench-common = { path = "../bench-common" }

# rquickjs ships no prebuilt bindings for iOS or Android; bindgen finds
# libclang in Xcode, and cargo-ndk hands it the NDK's sysroot.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["array-buffer", "bindgen"] }
