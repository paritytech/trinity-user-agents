[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["array-buffer"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
