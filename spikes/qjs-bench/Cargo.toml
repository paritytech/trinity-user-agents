# Throwaway M0 benchmark for wasm-sandboxed QuickJS workers.
# Its own workspace so nothing here reaches the main workspace, its lints or CI.
[workspace]
resolver = "2"
members = ["bench-common", "benchkit", "guest", "runner", "runner-pulley", "runner-wasm2c"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The interpreter is the hot path; the guest's own size profile stays "s".
[profile.release.package.wasmi]
opt-level = 3
[profile.release.package.wasmi_core]
opt-level = 3
[profile.release.package.wasmi_ir]
opt-level = 3
