<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Loading product</title>
<!--
  The loader shows nothing of its own: the host draws the progress and any
  failure over the app, in the app's colours, and keeps the detail for the
  developer tools. The line stays for assistive technology.
-->
<style>
  :root {
    color-scheme: dark;
    background: #0b0c0f;
  }
  body {
    margin: 0;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
<p id="status" role="status" data-state="loading">Loading…</p>
<script src="./page.js"></script>
