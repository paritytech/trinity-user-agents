name: Create Release Tag

on:
  schedule:
    - cron: '0 16 * * 1-5' # Runs every weekday at 17:00 CET
  workflow_dispatch:
    inputs:
      RELEASE_TAG:
        type: string
        description: Exact tag to create (for example, v2.0.0). Leave empty to auto-increment.
        required: false
      BUILD_TYPE:
        type: choice
        description: Build type for the release pipeline. "dev" keeps dev/test affordances that production builds hide; "production" matches release builds. Scheduled nightly runs use "dev".
        options:
          - dev
          - production
        default: dev

permissions:
  contents: write
  actions: write

jobs:
  create-tag:
    name: Create and push new tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for new commits since latest tag
        id: check
        if: ${{ !github.event.inputs.RELEASE_TAG }}
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "commit_count=1" >> $GITHUB_OUTPUT
          else
            COMMIT_COUNT=$(git rev-list --count $LATEST..HEAD)
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Notify no release (no changes)
        if: ${{ !github.event.inputs.RELEASE_TAG && steps.check.outputs.commit_count == '0' }}
        uses: appleboy/telegram-action@78e5f2ccac7c07db6afc0e8a0f9055f8f6aef7b1 # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          format: markdown
          message: |
            ⏭️ *Nightly release skipped*

            No changes between \`main\` and the previous tag. Nightly release will not be created.

            *Repo:* ${{ github.repository }}
            *Workflow:* ${{ github.workflow }}

      - name: Get latest tag and bump version
        id: bump
        if: ${{ !github.event.inputs.RELEASE_TAG && steps.check.outputs.commit_count != '0' }}
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          . .github/bump_release_version.sh "$LATEST" patch

      - name: Create and push tag
        id: create_tag
        if: ${{ github.event.inputs.RELEASE_TAG || steps.check.outputs.commit_count != '0' }}
        run: |
          if [ -n "${{ github.event.inputs.RELEASE_TAG }}" ]; then
            NEW_TAG="${{ github.event.inputs.RELEASE_TAG }}"
          else
            NEW_TAG="v${{ steps.bump.outputs.major }}.${{ steps.bump.outputs.minor }}.${{ steps.bump.outputs.patch }}"
          fi

          if ! printf '%s' "$NEW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$'; then
            echo "Invalid tag format: $NEW_TAG"
            echo "Expected format like v2.0.0"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "Tag already exists locally: $NEW_TAG"
            exit 1
          fi

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Trigger release pipeline for new tag
        if: ${{ github.event.inputs.RELEASE_TAG || steps.check.outputs.commit_count != '0' }}
        run: gh workflow run release-pipeline.yml --ref "${{ steps.create_tag.outputs.tag }}" -f BUILD_TYPE="${{ github.event.inputs.BUILD_TYPE || 'dev' }}" -f PUBLISH_RELEASE=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
