name: Unit tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Scoped to what publish-unit-test-result-action actually needs. `cancel-in-progress` above is
# handled by GitHub itself and requires no token permission.
permissions:
  contents: read
  checks: write        # Necessary to write reports
  pull-requests: write # Necessary to comment on PRs

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 📄 Post results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          files: ./node_modules/.tmp/junit-*.xml
          check_name: 'Unit Test Results'
          comment_mode: 'changes'
          github_token: ${{ secrets.GITHUB_TOKEN }}
