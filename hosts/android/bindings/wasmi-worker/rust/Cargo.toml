[package]
authors = ['Parity Technologies']
edition = '2021'
license = 'GPL-3.0-or-later'
name = "wasmi-worker"
repository = 'https://github.com/paritytech/trinity-user-agents'
version = "0.1.0"
description = "Embedded wasmi sandbox for Worker products: one bounded guest instance per handle, driven turn by turn from Kotlin over JNI"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasmi = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
panic = "abort"
